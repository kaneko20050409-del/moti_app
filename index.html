:root{
  /* Layout: one thumb-reach column of large rounded surfaces on a tinted ground;
     one solid-colour hero per screen, tertiary reserved for achievements. */
  --font:"Google Sans Flex",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.05,.7,.1,1); --ease-in:cubic-bezier(.3,0,.8,.15); --spring:cubic-bezier(.34,1.56,.64,1);
  --lift:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.04);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--on);font:400 16px/1.6 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.lock{overflow:hidden}
h1,h2,h3,p,ol,ul,figure{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
.num{font-variation-settings:"ROND" 100;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.muted{color:var(--on-v);font-size:14px}
.note{font-size:13px;line-height:1.6;color:var(--on-v)}

#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 108px)}
#view{display:flex;flex-direction:column;gap:12px}
#view.has-fab{padding-bottom:72px}

/* ---------- ripple and press ---------- */
.rip{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:rp .6s var(--ease-out) forwards}
@keyframes rp{0%{transform:scale(0);opacity:.18}55%{transform:scale(1);opacity:.12}100%{transform:scale(1);opacity:0}}
.btn,.task,.fab,.chip,.icon-btn,.th,.d{transition:transform .18s var(--ease)}
.btn:active:not(:disabled),.task:active,.fab:active,.chip:active,.icon-btn:active:not(:disabled),.th:active{transform:scale(.96)}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 4px}
.bar h1{font-size:30px;font-weight:800;line-height:1.25;letter-spacing:.01em}
.bar .sub{font-size:13px;color:var(--on-v);line-height:1.4}
.bar-a{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--on-v)}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:24px;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap}
.btn svg.i{width:20px;height:20px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.outlined{box-shadow:inset 0 0 0 1.5px var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:0 14px}
.btn.danger{color:var(--error)}
.btn.sm{min-height:40px;border-radius:20px;font-size:14px;padding:0 14px 0 10px;gap:4px}
.btn.big{min-height:56px;border-radius:28px;font-size:16px}
.btn.wide{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 130px}
.stack{display:flex;flex-direction:column;gap:12px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outline-v);font-size:14px;font-weight:600;color:var(--on-v)}
.chip svg.i{width:16px;height:16px;stroke-width:2.6}
.chip[aria-pressed="true"]{background:var(--secondary-c);box-shadow:none;color:var(--on-secondary-c);padding-left:10px}

select,.inp,textarea{width:100%;min-height:54px;padding:0 16px;border-radius:var(--r-md);border:0;background:var(--s2);font-size:16px;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .2s}
select:focus,.inp:focus,textarea:focus{outline-color:var(--primary)}
textarea{padding:14px 16px;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border-radius:var(--r-xl);padding:18px;box-shadow:var(--lift)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.card-h h2,.grp-h h2{font-size:16px;font-weight:700;line-height:1.3}
.frac{font-size:13px;color:var(--on-v);white-space:nowrap}
.frac .num{font-size:22px;color:var(--on)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 0 6px;min-height:44px}
.banner{border-radius:var(--r-lg);padding:16px;background:var(--tertiary-c);color:var(--on-tertiary-c);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.6}
.banner .btn{background:var(--on-tertiary-c);color:var(--tertiary-c)}

/* ---------- today ---------- */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:22px 20px;border-radius:var(--r-xl);background:var(--hero-bg);color:var(--hero-on)}
.hero::after{content:"";position:absolute;right:-56px;top:-70px;width:190px;height:190px;border-radius:50%;background:var(--hero-on);opacity:.07;pointer-events:none}
.ring{position:relative;flex:none;width:96px;height:96px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--hero-on);opacity:.2}
.ring .prg{stroke:var(--hero-ring);transition:stroke-dashoffset .7s var(--ease)}
.ring-c{position:relative;font-size:34px}
.ring-c small{font-size:17px;opacity:.75;margin-left:1px}
.ring-c svg.i{width:38px;height:38px;stroke-width:3;stroke:var(--hero-ring)}
.ring.full.pop{animation:ring-pop .7s var(--spring)}
.ring.full.pop .ring-c svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s var(--ease) .25s forwards}
.hero-t{position:relative;min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-k{font-size:13px;color:var(--hero-dim);line-height:1.3}
.hero-h{font-size:26px;font-weight:800;line-height:1.25;text-wrap:balance}
.hero-s{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tagc{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 7px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap;background:color-mix(in oklab,var(--hero-on) 16%,transparent)}
.tagc svg.i{width:16px;height:16px}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.d{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:8px 0 6px;border-radius:18px}
.d-l{font-size:12px;color:var(--on-v);line-height:1}
.d-n{font-size:13px;color:var(--on-v);font-weight:600}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--on-primary)}
.dot svg.i{width:18px;height:18px;stroke-width:2.8}
.d.done .dot{background:var(--primary)}
.d.now:not(.done) .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--primary)}
.d.future .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--outline-v)}
.d.cur{background:var(--secondary-c)}
.d.cur .d-l,.d.cur .d-n{color:var(--on-secondary-c)}
.d.cur:not(.done):not(.now) .dot{background:var(--s1)}
.d.pop .dot{animation:pop .5s var(--spring)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border-radius:var(--r-lg);background:var(--s1);box-shadow:var(--lift);text-align:left}
.task.done{background:var(--secondary-c);color:var(--on-secondary-c);box-shadow:none}
.cb{position:relative;flex:none;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--outline);display:grid;place-items:center}
.cb svg{width:22px;height:22px;fill:none;stroke:var(--on-primary);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ck{stroke-dasharray:1;stroke-dashoffset:1}
.done .cb{background:var(--primary);box-shadow:none}
.done .ck{stroke-dashoffset:0}
.t-n{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.t-r{flex:none;font-size:12px;font-weight:600;opacity:.75;white-space:nowrap}
.burst{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;opacity:0;pointer-events:none}
.task.pop{animation:task-in .5s var(--ease)}
.task.pop .cb{animation:pop .5s var(--spring)}
.task.pop .ck{stroke-dashoffset:1;animation:draw .3s var(--ease) .12s forwards}
.task.pop .burst{animation:burst .65s var(--ease-out) .05s}
.task.unpop .cb{animation:shrink .25s var(--ease)}

.sum{display:flex;flex-direction:column;gap:8px}
.sum li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum li span:last-child{color:var(--on-v);text-align:right;font-variant-numeric:tabular-nums}

.fab{position:fixed;z-index:9;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom) + 96px);display:flex;align-items:center;gap:10px;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.14)}
.fab.tonal{background:var(--primary-c);color:var(--on-primary-c)}

/* ---------- train ---------- */
.stats{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.stat{border-radius:var(--r-lg);padding:14px 16px;background:var(--primary-c);color:var(--on-primary-c);font-size:13px;line-height:1.3}
.stat .num{display:block;font-size:34px;margin-bottom:4px}
.stat .num small{font-size:16px;margin-left:3px}
.exs{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--s1);border-radius:var(--r-xl);box-shadow:var(--lift)}
.ex-h{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:12px 14px 12px 18px;border-radius:var(--r-xl);text-align:left}
.ex-n{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ex-m{font-size:13px;color:var(--on-v);white-space:nowrap}
.ex-h svg.i{color:var(--on-v);transition:transform .3s var(--ease)}
.ex.on .ex-h svg.i{transform:rotate(180deg)}
.ex-b{padding:0 18px 16px;display:flex;flex-direction:column;gap:14px}
.ex.opening .ex-b{animation:open .38s var(--ease-out)}
.prev{font-size:13px;color:var(--on-v);line-height:1.5}
.sets{display:flex;flex-direction:column;gap:6px}
.sets li{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px 0 10px;border-radius:var(--r-md);background:var(--s2)}
.sets li.new{animation:row-in .45s var(--spring)}

<script>
(function () {

/* ================= helpers ================= */
const KEY = 'tsumiage.v1';
const $ = (s, r) => (r || document).querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DAY = 864e5;
const r2 = n => Math.round(n * 100) / 100;

function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

function fmtVol(kg) {

}
const fmtDec = (v, dec) => dec ? v.toFixed(dec) : fmtInt(v);
const volText = kg => { const f = fmtVol(kg); return fmtDec(f.n, f.dec) + f.u; };
function parseNum(s) {
  s = String(s).replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(',', '.');

}

const STANDALONE = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));

const PATHS = {

  flame: '<path d="M12.3 2.5c.4 3.2 4.7 5 4.7 10.3a5 5 0 0 1-10 0c0-1.9.7-3.2 1.7-4.3.3 1.3 1 2 1.7 2C10.3 8 10.6 4.5 12.3 2.5z"/>',
  star: '<path d="M12 3.2l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17.1 6.6 20l1-6.1-4.4-4.3 6.1-.9z"/>'
};
const ic = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;
// Scalloped disc used for badges and the celebration emblem.
const COOKIE = (function () {
  let d = ''; const N = 180;
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2, r = 47 * (0.93 + 0.07 * Math.cos(12 * a)); d += (i ? 'L' : 'M') + (r * Math.cos(a)).toFixed(2) + ' ' + (r * Math.sin(a)).toFixed(2); }
  return d + 'Z';
})();
const cookieSVG = cls => `<svg class="${cls || ''}" viewBox="-50 -50 100 100" aria-hidden="true"><path d="${COOKIE}"/></svg>`;

/* ================= data ================= */
const CATS = ['胸', '背中', '脚', '肩', '腕', '体幹', 'その他'];
const TYPES = { weight: '重さ × 回数', reps: '回数のみ', time: '時間' };
const PALETTES = [{"id": "cobalt", "name": "コバルト"}, {"id": "forest", "name": "フォレスト"}, {"id": "coral", "name": "コーラル"}, {"id": "grape", "name": "グレープ"}, {"id": "sumi", "name": "スミ"}];
const MODES = [['auto', '自動'], ['light', 'ライト'], ['dark', 'ダーク']];
const DEFAULT_EX = [
  ['bench', 'ベンチプレス', '胸', 'weight', 1],
  ['dbpress', 'ダンベルプレス', '胸', 'weight', 0],
  ['chestpress', 'チェストプレス', '胸', 'weight', 0],
  ['pushup', '腕立て伏せ', '胸', 'reps', 0],
  ['deadlift', 'デッドリフト', '背中', 'weight', 1],
  ['latpull', 'ラットプルダウン', '背中', 'weight', 0],
  ['row', 'シーテッドロー', '背中', 'weight', 0],
  ['bentrow', 'ベントオーバーロー', '背中', 'weight', 1],
  ['pullup', '懸垂', '背中', 'reps', 0],
  ['squat', 'スクワット', '脚', 'weight', 1],
  ['legpress', 'レッグプレス', '脚', 'weight', 0],
  ['legext', 'レッグエクステンション', '脚', 'weight', 0],
  ['legcurl', 'レッグカール', '脚', 'weight', 0],
  ['ohp', 'オーバーヘッドプレス', '肩', 'weight', 1],
  ['shoulderpress', 'ダンベルショルダープレス', '肩', 'weight', 0],
  ['sideraise', 'サイドレイズ', '肩', 'weight', 0],
  ['curl', 'アームカール', '腕', 'weight', 0],
  ['pressdown', 'トライセプスプレスダウン', '腕', 'weight', 0],
  ['plank', 'プランク', '体幹', 'time', 0],
  ['crunch', 'クランチ', '体幹', 'reps', 0]
];
// Rough reference weights in kg, used only for the "how much is that" comparison.
const REFS = [
  { n: '力士', w: 160, c: '人' },
  { n: 'グランドピアノ', w: 300, c: '台' },
  { n: '軽自動車', w: 900, c: '台' },
  { n: 'アフリカゾウ', w: 6000, c: '頭' },
  { n: '新幹線の車両', w: 44000, c: '両' },
  { n: 'シロナガスクジラ', w: 150000, c: '頭' },
  { n: '奈良の大仏', w: 250000, c: '体' },
  { n: '国際宇宙ステーション', w: 420000, c: '基' },
  { n: '東京タワー', w: 4000000, c: '基' }
];

function fresh() {
  return {
    v: 2, demo: false,
    settings: { weeklyGoal: 3, lastExport: null, palette: 'cobalt', mode: 'auto' },
    exercises: DEFAULT_EX.map(e => ({ id: e[0], name: e[1], cat: e[2], type: e[3], barbell: !!e[4] })),
    habits: [{ id: 'study', name: '2時間勉強する' }, { id: 'water', name: '水を2L飲む' }],
    workouts: {}, habitLog: {}
  };
}

function sample() {
  const s = fresh(); s.demo = true;
  let seed = 20261113;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t0 = today(), start = addDays(weekStart(t0), -70);
  const plans = {
    1: [['bench', 40, 1.25], ['shoulderpress', 8, 0.4], ['pressdown', 15, 0.75]],
    3: [['deadlift', 60, 2.5], ['latpull', 30, 1.25], ['curl', 6, 0.3]],
    5: [['squat', 50, 2], ['legpress', 80, 4], ['plank', 45, 4]]
  };
  for (let d = start; d < t0; d = addDays(d, 1)) {
    const k = dkey(d), ago = Math.round((t0 - d) / DAY), wk = Math.floor(Math.round((d - start) / DAY) / 7);
    const plan = plans[d.getDay()];
    if (plan && (ago <= 7 || rnd() > 0.18)) {
      s.workouts[k] = plan.map(p => {
        const id = p[0], base = p[1], rate = p[2];
        if (id === 'plank') { const t = Math.round((base + wk * rate) / 5) * 5; return { ex: id, sets: [{ t: t }, { t: t - 5 }] }; }
        const st = base < 12 ? 1 : 2.5;
        const w = Math.round((base + wk * rate) / st) * st, r = 8 + Math.floor(rnd() * 3);
        return { ex: id, sets: [{ w: w, r: r }, { w: w, r: r - (rnd() > 0.5 ? 1 : 0) }, { w: w, r: r - 1 - Math.floor(rnd() * 2) }] };
      });
    }
    const day = {}, a = rnd(), b = rnd();
    if (ago <= 5 || a > 0.3) day.study = 1;
    if (ago <= 8 || b > 0.2) day.water = 1;
    if (Object.keys(day).length) s.habitLog[k] = day;
  }
  const gap = dkey(addDays(t0, -13)); delete s.habitLog[gap]; delete s.workouts[gap];
  s.habitLog[dkey(t0)] = { water: 1 };
  return s;
}

// Accepts saved data from any earlier version and returns the current shape.
function normalize(o) {
  if (!o || typeof o !== 'object' || !o.workouts || typeof o.workouts !== 'object' || !Array.isArray(o.habits) || !Array.isArray(o.exercises)) {
    throw new Error('bad');
  }
  const f = fresh(), st = o.settings || {};
  const s = {
    v: 2, demo: !!o.demo,
    settings: {
      weeklyGoal: Math.min(7, Math.max(1, Math.round(Number(st.weeklyGoal) || 3))),
      lastExport: st.lastExport || null,
      palette: PALETTES.some(p => p.id === st.palette) ? st.palette : 'cobalt',
      mode: MODES.some(m => m[0] === st.mode) ? st.mode : 'auto'
    },
    exercises: o.exercises.filter(e => e && e.id && e.name).map(e => ({ id: String(e.id), name: String(e.name), cat: CATS.includes(e.cat) ? e.cat : 'その他', type: TYPES[e.type] ? e.type : 'weight', barbell: !!e.barbell })),
    habits: [], workouts: {}, habitLog: {}
  };
  if (!s.exercises.length) s.exercises = f.exercises;
  // Older saves counted an amount per goal; a day counts as done when it reached the target.
  const need = {};
  for (const h of o.habits) {
    if (!h || !h.id || !h.name) continue;
    const old = h.kind === 'num' && Number(h.target) > 0;
    need[h.id] = old ? Number(h.target) : 1;
    s.habits.push({ id: String(h.id), name: old ? `${h.name} ${fmtN(Number(h.target))}${h.unit || ''}` : String(h.name) });
  }
  const okKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  for (const k of Object.keys(o.workouts)) {
    if (!okKey(k) || !Array.isArray(o.workouts[k])) continue;
    const list = o.workouts[k].filter(e => e && e.ex && Array.isArray(e.sets)).map(e => ({
      ex: String(e.ex),
      sets: e.sets.filter(x => x && typeof x === 'object').map(x => {
        const y = {};
        if (isFinite(x.w)) y.w = Number(x.w);
        if (isFinite(x.r)) y.r = Number(x.r);
        if (isFinite(x.t)) y.t = Number(x.t);
        return y;
      })
    }));
    if (list.length) s.workouts[k] = list;
  }
  const hl = o.habitLog && typeof o.habitLog === 'object' ? o.habitLog : {};
  for (const k of Object.keys(hl)) {
    if (!okKey(k) || !hl[k] || typeof hl[k] !== 'object') continue;
    const day = {};
    for (const id of Object.keys(hl[k])) if (need[id] && Number(hl[k][id]) >= need[id] - 1e-9) day[id] = 1;
    if (Object.keys(day).length) s.habitLog[k] = day;
  }
  return s;
}

let state, storageOk = true, undoSnap = null;
function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) { storageOk = false; } return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; } }
let askedPersist = false;
function askPersist() {
  if (askedPersist || FRAMED) return; askedPersist = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
const snap = () => { undoSnap = JSON.stringify(state); };
const applyTheme = () => { if (window.__theme) window.__theme(state.settings.palette, state.settings.mode); };

/* ================= derived ================= */
const exById = id => state.exercises.find(e => e.id === id);
const session = k => state.workouts[k] || [];
const hasWorkout = k => session(k).some(e => e.sets.length > 0);
const setCount = k => session(k).reduce((a, e) => a + e.sets.length, 0);
const setVol = x => (x.w > 0 && x.r > 0 ? x.w * x.r : 0);
const dayVol = k => session(k).reduce((a, e) => a + e.sets.reduce((b, x) => b + setVol(x), 0), 0);
const habitDone = (k, h) => !!(state.habitLog[k] && state.habitLog[k][h.id]);
const doneCount = k => state.habits.filter(h => habitDone(k, h)).length;
const allDone = k => state.habits.length > 0 && doneCount(k) === state.habits.length;
const dayActive = k => hasWorkout(k) || doneCount(k) > 0;
function streakOf(fn) {
  let d = today(), n = 0;
  if (!fn(dkey(d))) d = addDays(d, -1);
  while (fn(dkey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function weekCount(k) {
  const ws = weekStart(parseKey(k)); let n = 0;
  for (let i = 0; i < 7; i++) if (hasWorkout(dkey(addDays(ws, i)))) n++;
  return n;
}
function weekRun() {
  const goal = state.settings.weeklyGoal, ws = weekStart(today()); let n = 0;
  for (let i = 0; i < 520; i++) { if (weekCount(dkey(addDays(ws, -7 * i))) >= goal) n++; else if (i > 0) break; }
  return n;
}
function totalVol() { let t = 0; for (const k of Object.keys(state.workouts)) t += dayVol(k); return t; }
function exHistory(id) {
  const out = [];
  for (const d of Object.keys(state.workouts).sort()) {
    const sets = [];
    for (const e of state.workouts[d]) if (e.ex === id) for (const x of e.sets) sets.push(x);
    if (sets.length) out.push({ d: d, sets: sets });
  }
  return out;
}
const prevSession = (id, k) => { const h = exHistory(id).filter(x => x.d < k); return h.length ? h[h.length - 1] : null; };
const e1rm = x => (x.r <= 1 ? x.w : x.w * (1 + x.r / 30));
const setText = (ex, x) => ex.type === 'weight' ? `${fmtN(x.w)}×${x.r}` : ex.type === 'reps' ? `${x.r}回` : fmtTime(x.t);

// A set is a personal best when it beats everything logged before it,
// but only once the exercise has an earlier session to compare against.
function scanPRs(id) {
  const ex = exById(id), out = new Map();
  if (!ex) return out;
  let mw = 0, me = 0, mr = 0, mt = 0;
  exHistory(id).forEach((h, si) => {
    h.sets.forEach((x, i) => {
      const key = h.d + '|' + i;
      if (ex.type === 'weight') {
        const e = e1rm(x);
        if (si > 0 && x.w > mw + 1e-9) out.set(key, { kind: 'w', prev: mw, val: x.w });
        else if (si > 0 && x.r <= 15 && e > me + 0.05) out.set(key, { kind: 'e', prev: me, val: e });
        mw = Math.max(mw, x.w || 0); me = Math.max(me, x.r <= 15 ? e : 0);
      } else if (ex.type === 'reps') {
        if (si > 0 && x.r > mr) out.set(key, { kind: 'r', prev: mr, val: x.r });
        mr = Math.max(mr, x.r || 0);
      } else {
        if (si > 0 && x.t > mt) out.set(key, { kind: 't', prev: mt, val: x.t });
        mt = Math.max(mt, x.t || 0);
      }
    });
  });
  return out;
}

/* ================= ui state ================= */
const ORDER = ['today', 'train', 'progress', 'setup'];
const ui = { tab: 'today', date: tkey(), follow: true, active: 0, draft: null, sheet: null, heat: 'workout', heatDay: null, chartEx: null, chartMetric: 'w', chartSel: null, enter: 'u', fx: {} };
const memo = new Map();
let lastSetAt = 0, toastTimer = 0, sheetTimer = 0;

function setDate(k) {
  const t = tkey();
  if (k > t) k = t;
  ui.date = k; ui.follow = k === t; ui.active = Math.max(0, session(k).length - 1); ui.draft = null;
}

/* ================= views ================= */
function vToday() {
  const tk = tkey(), dk = ui.date, isToday = dk === tk, d = parseKey(dk), fx = ui.fx;
  const ws = weekStart(d), goal = state.settings.weeklyGoal, thisWeek = weekStart(today()).getTime() === ws.getTime();
  let wk = '', cnt = 0;
  for (let i = 0; i < 7; i++) {
    const x = addDays(ws, i), k = dkey(x), done = hasWorkout(k);
    if (done) cnt++;
    wk += `<li><button class="d rip${done ? ' done' : ''}${k === dk ? ' cur' : ''}${k === tk ? ' now' : ''}${k > tk ? ' future' : ''}" data-act="go-day" data-d="${k}" ${k > tk ? 'disabled' : ''} aria-label="${fmtDate(k, 1)}${done ? ' 筋トレ済み' : ''}"${k === dk ? ' aria-current="date"' : ''}><span class="d-l">${WD[x.getDay()]}</span><span class="dot">${done ? ic('check') : ''}</span><span class="d-n num">${x.getDate()}</span></button></li>`;
  }
  const total = state.habits.length, done = doneCount(dk), p = total ? done / total : 0, C = 2 * Math.PI * 40;
  const head = !total ? 'まだありません' : done === total ? 'すべて達成' : `あと${total - done}つ`;
  const streak = streakOf(dayActive);
  const tasks = state.habits.map((h, i) => {
    const on = habitDone(dk, h), run = streakOf(k => habitDone(k, h));
    return `<li><button class="task rip${on ? ' done' : ''}${fx.task === h.id ? ' pop' : ''}${fx.taskOff === h.id ? ' unpop' : ''}" style="--i:${i}" role="checkbox" aria-checked="${on}" data-act="habit-toggle" data-id="${esc(h.id)}"><span class="cb"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ck" pathLength="1" d="M5.5 12.5l4.2 4.2L18.5 8"/></svg><i class="burst"></i></span><span class="t-n">${esc(h.name)}</span>${run >= 2 ? `<span class="t-r">${run}日連続</span>` : ''}</button></li>`;
  }).join('');

  const ses = session(dk).filter(e => e.sets.length), vol = dayVol(dk), label = isToday ? '今日' : 'この日';
  const wo = ses.length
    ? `<div class="card-h"><h2>${label}の筋トレ</h2><p class="frac">${setCount(dk)}セット${vol ? `・${fmtInt(vol)}kg` : ''}</p></div><ul class="sum">${ses.map(e => { const ex = exById(e.ex); return ex ? `<li><span>${esc(ex.name)}</span><span>${e.sets.map(x => setText(ex, x)).join('・')}</span></li>` : ''; }).join('')}</ul><button class="btn tonal wide rip" style="margin-top:16px" data-act="go-train">${ic('dumbbell')}続きを記録する</button>`
    : `<div class="card-h" style="margin-bottom:6px"><h2>${label}の筋トレ</h2></div><p class="muted">まだ記録がありません。</p><button class="btn filled big wide rip" style="margin-top:16px" data-act="go-train">${ic('dumbbell')}筋トレを記録する</button>`;

  return `
  <header class="bar">
    <div><h1>${isToday ? '今日' : fmtDate(dk)}</h1><p class="sub">${isToday ? fmtDate(dk, 1) : WD[d.getDay()] + '曜日'}</p></div>
    <div class="bar-a">
      ${isToday ? '' : `<button class="btn tonal sm rip" style="padding:0 14px" data-act="go-day" data-d="${tk}">今日に戻る</button>`}
      <button class="icon-btn rip" data-act="day-shift" data-d="-1" aria-label="前の日">${ic('left')}</button>
      <button class="icon-btn rip" data-act="day-shift" data-d="1" aria-label="次の日" ${isToday ? 'disabled' : ''}>${ic('right')}</button>
    </div>
  </header>
  ${state.demo ? `<div class="banner"><p>いまはサンプルの記録を表示しています。自由に触って試せます。</p><button class="btn rip" data-act="demo-clear">サンプルを消して自分の記録を始める</button></div>` : ''}
  <section class="hero">
    <div class="ring${p >= 1 ? ' full' : ''}${fx.ring ? ' pop' : ''}">
      <svg viewBox="0 0 96 96" aria-hidden="true"><circle class="trk" cx="48" cy="48" r="40"/><circle class="prg" cx="48" cy="48" r="40" stroke-dasharray="${C.toFixed(2)}" style="stroke-dashoffset:${(C * (1 - p)).toFixed(2)}" data-tw="ring" data-prop="stroke-dashoffset" data-to="${(C * (1 - p)).toFixed(2)}" data-from="${C.toFixed(2)}"/></svg>
      <span class="ring-c num">${p >= 1 ? ic('check') : `${done}<small>/${total}</small>`}</span>
    </div>
    <div class="hero-t">
      <p class="hero-k">${label}の目標</p>
      <p class="hero-h">${head}</p>
      <p class="hero-s"><span class="tagc">${ic('flame', 'f')}${streak}日連続</span><span class="tagc" style="padding-left:10px">${hasWorkout(dk) ? '筋トレ済み' : '筋トレはまだ'}</span></p>
    </div>
  </section>
  <section class="card">
    <div class="card-h"><h2>${thisWeek ? '今週' : 'この週'}の筋トレ</h2><p class="frac"><b class="num">${cnt}</b> / ${goal}回${cnt >= goal ? '・達成' : ''}</p></div>
    <ol class="wk">${wk}</ol>
  </section>
  <section class="grp">
    <div class="grp-h"><h2>毎日の目標</h2><button class="btn text sm rip" data-act="habit-edit" data-id="">${ic('plus')}追加</button></div>
    ${total ? `<ul class="tasks">${tasks}</ul>` : `<div class="card"><p class="muted">毎日続けたいことを「追加」から決められます。できた日に押すだけで記録できます。</p></div>`}
  </section>
  <section class="card">${wo}</section>`;
}

function ensureDraft() {
  const dk = ui.date, ses = session(dk);
  if (ui.active >= ses.length) ui.active = Math.max(0, ses.length - 1);
  const e = ses[ui.active];
  if (!e) { ui.draft = null; return; }
  const key = dk + '|' + ui.active + '|' + e.ex;
  if (ui.draft && ui.draft.key === key) return;
  const ex = exById(e.ex) || {}, last = e.sets[e.sets.length - 1], prev = prevSession(e.ex, dk);
  const ref = last || (prev && prev.sets[0]) || {};
  ui.draft = {
    key: key,
    w: ref.w != null ? ref.w : (ex.barbell ? 20 : 10),
    r: ref.r != null ? ref.r : 10,
    m: ref.t != null ? Math.floor(ref.t / 60) : 0,
    s: ref.t != null ? ref.t % 60 : 30
  };
}

function platesHTML(w) {
  const BAR = 20;
  if (!(w >= BAR)) return `<p class="plates-cap">バー（20kg）より軽い重さです</p>`;
  let side = (w - BAR) / 2; const used = [];
  for (const p of [25, 20, 15, 10, 5, 2.5, 1.25]) while (side >= p - 1e-9 && used.length < 12) { used.push(p); side -= p; }
  const pl = p => `<i class="pl p${String(p).replace('.', '_')}"></i>`;
  const cap = used.length ? `片側 ${used.map(fmtN).join('・')}` : 'プレートなし';
  return `<div class="pl-row" role="img" aria-label="バー20kgと${cap}">${used.slice().reverse().map(pl).join('')}<i class="sleeve"></i><i class="bar-mid"></i><i class="sleeve"></i>${used.map(pl).join('')}</div>
    <p class="plates-cap">バー20kg ＋ ${cap}${side > 1e-6 ? `（残り${fmtN(side * 2)}kgは組めません）` : ''}</p>`;
}

function stepper(f, label, val, d) {
  return `<div class="stepper"><label for="in-${f}">${label.replace(' ', '<br>')}</label>
    <button class="rip" data-act="step" data-f="${f}" data-d="${-d}" aria-label="${label}を${d}減らす">−${d}</button>
    <input id="in-${f}" data-in="draft" data-f="${f}" type="text" inputmode="decimal" autocomplete="off" value="${fmtN(val)}">
    <button class="rip" data-act="step" data-f="${f}" data-d="${d}" aria-label="${label}を${d}増やす">＋${d}</button></div>`;
}

function vTrain() {
  const dk = ui.date, ses = session(dk), isToday = dk === tkey(), fx = ui.fx;
  ensureDraft();
  const vol = dayVol(dk), sets = setCount(dk);
  const cards = ses.map((e, i) => {
    const ex = exById(e.ex); if (!ex) return '';
    const on = i === ui.active;
    const head = `<button class="ex-h rip" data-act="card-open" data-i="${i}" aria-expanded="${on}"><span class="ex-n">${esc(ex.name)}</span><span class="ex-m">${e.sets.length ? e.sets.length + 'セット' : '未記録'}</span>${ic('down')}</button>`;
    if (!on) return `<li class="ex">${head}</li>`;
    const prs = scanPRs(ex.id), prev = prevSession(ex.id, dk), dr = ui.draft;
    const rows = e.sets.map((x, j) => {
      const pr = prs.get(dk + '|' + j);
      const v = ex.type === 'weight' ? `<b class="num">${fmtN(x.w)}</b> kg × <b class="num">${x.r}</b> 回`
        : ex.type === 'reps' ? `<b class="num">${x.r}</b> 回` : `<b class="num">${fmtTime(x.t)}</b>`;
      return `<li${fx.set === i + '|' + j ? ' class="new"' : ''}><span class="no">${j + 1}</span><span class="v">${v}</span>${pr ? `<span class="pr">${ic('star', 'f')}自己ベスト</span>` : ''}<button class="x rip" data-act="del-set" data-i="${i}" data-j="${j}" aria-label="${j + 1}セット目を消す">${ic('x')}</button></li>`;
    }).join('');
    const entry = ex.type === 'weight' ? stepper('w', '重さ kg', dr.w, 2.5) + stepper('r', '回数', dr.r, 1)
      : ex.type === 'reps' ? stepper('r', '回数', dr.r, 1)
        : stepper('m', '分', dr.m, 1) + stepper('s', '秒', dr.s, 5);
    return `<li class="ex on${fx.open === i ? ' opening' : ''}">${head}<div class="ex-b">
      <p class="prev">${prev ? `前回 ${fmtShort(prev.d)}：${prev.sets.map(x => setText(ex, x)).join('・')}` : 'この種目は今回が初めての記録です。'}</p>
      ${rows ? `<ol class="sets">${rows}</ol>` : ''}
      <div class="entry">${entry}</div>
      ${ex.type === 'weight' && ex.barbell ? `<div class="plates" id="plates">${platesHTML(dr.w)}</div>` : ''}
      <button class="btn filled big wide rip" data-act="log-set">${e.sets.length + 1}セット目を記録する</button>
      <div class="ex-f"><p class="rest" id="rest"></p><button class="btn text danger sm rip" style="padding:0 12px" data-act="del-entry" data-i="${i}">この種目を外す</button></div>
    </div></li>`;
  }).join('');

  const fv = fmtVol(vol);
  return `
  <header class="bar"><div><h1>筋トレ</h1><p class="sub">${isToday ? '今日 ' : ''}${fmtDate(dk, 1)}${isToday ? '' : ' の記録を編集中'}</p></div></header>
  ${ses.length ? `<div class="stats"><div class="stat"><b class="num" data-count="t-sets" data-to="${sets}">${sets}</b>セット</div><div class="stat"><b class="num"><span data-count="t-vol" data-to="${vol}">${fmtInt(vol)}</span><small>kg</small></b>合計の重さ</div></div>
  <ol class="exs">${cards}</ol>
  <button class="fab tonal rip" data-act="pick-open">${ic('plus')}<span>種目を追加</span></button>`
    : `<div class="card empty"><p>種目を選ぶと、セットごとに重さと回数を記録できます。前回の記録が出るので、同じ内容ならボタン1つで済みます。</p><button class="btn filled big rip" data-act="pick-open">${ic('plus')}種目を追加</button></div>`}`;
}

function liftHTML() {
  const tot = totalVol(), f = fmtVol(tot);
  let cur = null, next = null;
  for (const r of REFS) { if (tot >= r.w) cur = r; else { next = r; break; } }
  const eq = cur ? `${cur.n} 約${(Math.round(tot / cur.w * 10) / 10).toFixed(1)}${cur.c}分` : 'ここから積み上げていきます';
  let nx = '';
  if (next) {
    const base = cur ? cur.w : 0, pct = Math.max(2, (tot - base) / (next.w - base) * 100).toFixed(1);
    nx = `<div class="lift-next"><div class="bar-t" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="次の目安まで"><i style="width:${pct}%" data-tw="lift" data-prop="width" data-to="${pct}%" data-from="0%"></i></div><p>次の目安は ${next.n}1${next.c}（約${volText(next.w)}）。あと ${volText(next.w - tot)}</p></div>`;
  }
  return `<section class="lift"><p class="lift-k">これまでに持ち上げた重さ</p><p class="lift-n num"><span data-count="lift-n" data-to="${f.n}" data-dec="${f.dec}">${fmtDec(f.n, f.dec)}</span><small>${f.u}</small></p><p class="lift-eq">${eq}</p>${nx}<p class="note" style="position:relative;margin-top:6px">重さ×回数の合計です。比べている物の重さはおおよその目安です。</p></section>`;
}

function heatHTML() {
  const N = 16, t = today(), tk = dkey(t), start = addDays(weekStart(t), -(N - 1) * 7);
  const habit = state.habits.find(h => h.id === ui.heat);
  if (ui.heat !== 'workout' && ui.heat !== 'goals' && !habit) ui.heat = 'workout';
  const chip = (id, name) => `<button class="chip rip" data-act="heat" data-id="${esc(id)}" aria-pressed="${ui.heat === id}">${ui.heat === id ? ic('check') : ''}${esc(name)}</button>`;
  const chips = chip('workout', '筋トレ') + (state.habits.length ? chip('goals', '毎日の目標') : '') + (state.habits.length > 1 ? state.habits.map(h => chip(h.id, h.name)).join('') : '');
  let cells = '', lastM = -1;
  for (let c = 0; c < N; c++) {
    const mon = addDays(start, c * 7);
    if (mon.getMonth() !== lastM && !(c === 0 && addDays(mon, 7).getMonth() !== mon.getMonth())) { cells += `<span class="m" style="grid-column:${c + 2};grid-row:1">${mon.getMonth() + 1}月</span>`; lastM = mon.getMonth(); }
    for (let r = 0; r < 7; r++) {
      const d = addDays(mon, r), k = dkey(d);
      if (k > tk) continue;
      let lv = 0, lab;
      if (habit) { const on = habitDone(k, habit); lv = on ? 4 : 0; lab = on ? '達成' : '未達成'; }
      else if (ui.heat === 'goals') {
        const n = doneCount(k), q = state.habits.length ? n / state.habits.length : 0;
        lv = q >= 1 ? 4 : q >= 0.66 ? 3 : q >= 0.33 ? 2 : q > 0 ? 1 : 0; lab = `目標 ${n}/${state.habits.length}`;
      } else {
        const n = setCount(k);
        lv = n >= 12 ? 4 : n >= 8 ? 3 : n >= 4 ? 2 : n > 0 ? 1 : 0; lab = n ? `${n}セット` : '記録なし';
      }
      cells += `<button class="cell l${lv}${k === ui.heatDay ? ' sel' : ''}${k === tk ? ' now' : ''}" style="grid-column:${c + 2};grid-row:${r + 2};--c:${c}" data-act="heat-day" data-d="${k}" aria-label="${fmtDate(k, 1)} ${esc(lab)}"${k === ui.heatDay ? ' aria-pressed="true"' : ''}></button>`;
    }
  }
  const wl = [0, 2, 4].map(r => `<span class="w" style="grid-column:1;grid-row:${r + 2}">${WD[(r + 1) % 7]}</span>`).join('');
  let day = '';
  if (ui.heatDay) {
    const k = ui.heatDay, n = setCount(k), vol = dayVol(k);
    const items = [`筋トレ：${n ? `${n}セット${vol ? `・${fmtInt(vol)}kg` : ''}` : '記録なし'}`].concat(state.habits.map(h => `${esc(h.name)}：${habitDone(k, h) ? '達成' : '未達成'}`));
    day = `<div class="day"><h3>${fmtDate(k, 1)}</h3><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul><button class="btn tonal sm rip" style="padding:0 16px" data-act="open-day" data-d="${k}">この日を開いて直す</button></div>`;
  }
  const legend = habit
    ? `<span>未達成</span><i class="cell"></i><i class="cell l4"></i><span>達成</span>`
    : `<span>${ui.heat === 'goals' ? '0' : '少ない'}</span><i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i><span>${ui.heat === 'goals' ? 'すべて達成' : '多い'}</span>`;
  return `<div class="chips">${chips}</div>
    <div class="heat" style="grid-template-columns:16px repeat(${N},minmax(0,1fr))">${wl}${cells}</div>
    <div class="legend">${legend}</div>
    ${day || `<p class="note" style="margin-top:8px">マスを押すと、その日の記録を見られます。</p>`}`;
}

function niceTicks(lo, hi, n) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), q = raw / mag;
  const step = (q <= 1 ? 1 : q <= 2 ? 2 : q <= 2.5 ? 2.5 : q <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(r2(v));
  return out;
}

function chartHTML() {
  const used = state.exercises.map(e => ({ e: e, h: exHistory(e.id) })).filter(x => x.h.length).sort((a, b) => b.h.length - a.h.length);
  if (!used.length) return `<p class="muted">筋トレを記録すると、種目ごとの伸びがここにグラフで出ます。</p>`;
  const cur = used.find(x => x.e.id === ui.chartEx) || used[0];
  ui.chartEx = cur.e.id;
  const ex = cur.e, hist = cur.h.slice(-40);
  const metrics = ex.type === 'weight' ? [['w', '最高重量'], ['e', '推定1RM']] : ex.type === 'reps' ? [['r', '最高回数']] : [['t', '最長時間']];
  if (!metrics.some(m => m[0] === ui.chartMetric)) ui.chartMetric = metrics[0][0];
  const mt = ui.chartMetric;
  const val = x => mt === 'w' ? (x.w || 0) : mt === 'e' ? e1rm(x) : mt === 'r' ? (x.r || 0) : (x.t || 0);
  const show = v => mt === 't' ? fmtTime(v) : mt === 'r' ? `${fmtN(v)}回` : `${fmtN(Math.round(v * 10) / 10)}kg`;
  const tick = v => mt === 't' ? fmtTime(v) : fmtN(v);
  const pts = hist.map(h => ({ d: h.d, v: Math.max.apply(null, h.sets.map(val)) }));
  let run = -Infinity; pts.forEach((p, i) => { p.pr = i > 0 && p.v > run + 1e-9; run = Math.max(run, p.v); });
  const sel = ui.chartSel != null && pts[ui.chartSel] ? ui.chartSel : pts.length - 1;

  const W = 340, H = 190, L = 36, R = 46, T = 14, B = 26;
  const ticks = niceTicks(Math.min.apply(null, pts.map(p => p.v)), Math.max.apply(null, pts.map(p => p.v)), 3);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length - 1].d).getTime();
  const X = p => pts.length === 1 || t1 === t0 ? L + (W - L - R) / 2 : L + 10 + (parseKey(p.d).getTime() - t0) / (t1 - t0) * (W - L - R - 10);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const f1 = n => n.toFixed(1);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + f1(X(p)) + ' ' + f1(Y(p.v))).join('');
  const lastI = pts.length - 1, lp = pts[lastI];
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.name)}の${metrics.find(m => m[0] === mt)[1]}の推移。最初 ${show(pts[0].v)}、最新 ${show(lp.v)}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text class="ax" x="${L - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">${tick(v)}</text>`).join('')}
    <text class="ax" x="${L + 10}" y="${H - 6}" text-anchor="middle">${fmtShort(pts[0].d)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(lp.d)}</text>` : ''}
    ${pts.length > 1 ? `<path class="area" d="${line}L${f1(X(lp))} ${H - B}L${f1(X(pts[0]))} ${H - B}Z"/><path class="ln" pathLength="1" d="${line}"/>` : ''}
    ${sel !== lastI ? `<line class="guide" x1="${f1(X(pts[sel]))}" x2="${f1(X(pts[sel]))}" y1="${T}" y2="${H - B}"/>` : ''}
    ${pts.map((p, i) => i === lastI ? '' : `<circle class="pt${p.pr ? ' pr' : ''}" style="--i:${i}" cx="${f1(X(p))}" cy="${f1(Y(p.v))}" r="${i === sel ? 5.5 : 4}"/>`).join('')}
    <circle class="pt end" style="--i:${lastI}" cx="${f1(X(lp))}" cy="${f1(Y(lp.v))}" r="6"/>
    <text class="endl" x="${f1(X(lp) + 10)}" y="${f1(Y(lp.v) + 5)}">${mt === 't' ? fmtTime(lp.v) : fmtN(Math.round(lp.v * 10) / 10)}</text>
    ${pts.map((p, i) => `<circle class="hit" cx="${f1(X(p))}" cy="${f1(Y(p.v))}" r="13" data-act="chart-pt" data-i="${i}" tabindex="0" role="button" aria-label="${fmtDate(p.d)} ${show(p.v)}"/>`).join('')}
  </svg>`;
  const diff = lp.v - pts[0].v;
  const dshow = mt === 't' ? `${Math.round(Math.abs(diff))}秒` : mt === 'r' ? `${fmtN(Math.abs(diff))}回` : `${fmtN(Math.round(Math.abs(diff) * 10) / 10)}kg`;
  return `
    <div class="field-row"><label for="chart-ex" class="note" style="flex:none;font-weight:600">種目</label><select id="chart-ex" data-change="chart-ex">${used.map(x => `<option value="${esc(x.e.id)}"${x.e.id === ex.id ? ' selected' : ''}>${esc(x.e.name)}</option>`).join('')}</select></div>
    ${metrics.length > 1 ? `<div class="chips">${metrics.map(m => `<button class="chip rip" data-act="chart-metric" data-id="${m[0]}" aria-pressed="${m[0] === mt}">${m[0] === mt ? ic('check') : ''}${m[1]}</button>`).join('')}</div>` : ''}
    <p class="readout"><span>${fmtDate(pts[sel].d, 1)}${pts[sel].pr ? ` <span class="pr" style="vertical-align:1px">${ic('star', 'f')}自己ベスト</span>` : ''}</span><b class="num">${show(pts[sel].v)}</b></p>
    <figure class="chart${ui.enter || ui.fx.chart ? ' draw' : ''}">${svg}</figure>
    <p class="chart-key"><span><i class="f"></i>自己ベストを更新した日</span><span><i></i>それ以外の日</span></p>
    ${pts.length > 1 ? `<p class="chart-sum">最初の ${show(pts[0].v)} から ${diff > 0 ? `<b>${dshow}伸びました</b>` : diff < 0 ? `${dshow}下がっています` : '変わっていません'}（${pts.length}回の記録）</p>` : `<p class="chart-sum">次に記録すると、線でつながります。</p>`}
    ${mt === 'e' ? `<p class="note" style="margin-top:6px">推定1RMは、重さと回数から計算した「1回だけ挙げられる重さ」の目安です。</p>` : ''}`;
}

function badgesHTML() {
  const goal = state.settings.weeklyGoal, ws = weekStart(today());
  let html = '', got = 0;
  for (let i = 0; i < 8; i++) {
    const s = addDays(ws, -7 * i), n = weekCount(dkey(s)), ok = n >= goal;
    if (ok) got++;
    html = `<li class="badge${ok ? ' got' : ''}${n > goal ? ' over' : ''}"><span class="disc num" style="--i:${7 - i}" aria-hidden="true">${cookieSVG()}<b>${n}</b></span><span>${i === 0 ? '今週' : fmtShort(dkey(s)) + '〜'}<br>${ok ? '達成' : `${n}/${goal}回`}</span></li>` + html;
  }
  const run = weekRun();
  return `<ol class="badges">${html}</ol><p class="note" style="margin-top:14px">直近8週のうち${got}週で達成${run >= 2 ? `、${run}週連続で達成中` : ''}。数字はその週に筋トレをした日数です。</p>`;
}

function vProgress() {
  return `
  <header class="bar"><div><h1>歩み</h1><p class="sub">これまでに積み上げた記録</p></div></header>
  ${liftHTML()}
  <section class="card"><div class="card-h"><h2>カレンダー</h2><p class="frac">${streakOf(dayActive)}日連続</p></div>${heatHTML()}
    <p class="note" style="margin-top:10px">連続日数は、筋トレをした日と、毎日の目標を1つ以上達成した日を数えます。</p></section>
  <section class="card"><div class="card-h"><h2>種目ごとの伸び</h2></div>${chartHTML()}</section>
  <section class="card"><div class="card-h"><h2>週の目標バッジ</h2><p class="frac">週${state.settings.weeklyGoal}回</p></div>${badgesHTML()}</section>`;
}

function vSetup() {
  const st = state.settings, g = st.weeklyGoal, le = st.lastExport;
  const days = le ? Math.round((today() - parseKey(le)) / DAY) : null;
  const place = FRAMED
    ? 'これは試し用の画面です。記録はこのブラウザにだけ残り、消えることがあります。続けて使うときは、ホーム画面に追加する版を使ってください。'
    : !storageOk ? 'このブラウザでは記録を保存できません。プライベートブラウズを切るか、Safariで開き直してください。'
      : STANDALONE ? '記録はこのiPhoneの中に保存されています。機種変更やアプリの削除に備えて、ときどき書き出しておくと安心です。'
        : '記録はこのブラウザの中に保存されています。Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように使えて記録も消えにくくなります。';
  return `

/* ================= render and motion ================= */
const VIEWS = { today: vToday, train: vTrain, progress: vProgress, setup: vSetup };

// Moves a bar or ring from where it was on the last render to its new value.
function runTweens() {
  $$('[data-tw]').forEach(el => {
    const k = el.dataset.tw, to = el.dataset.to, prop = el.dataset.prop;
    const from = ui.enter ? el.dataset.from : (memo.has(k) ? memo.get(k) : to);
    memo.set(k, to);
    if (REDUCED || from === to) return;
    el.style.transition = 'none'; el.style.setProperty(prop, from);
    el.getBoundingClientRect();
    el.style.transition = ''; el.style.setProperty(prop, to);
  });
}
function countTo(el, from, to, fmt, dur, end) {
  if (end == null) end = fmt(to);
  if (REDUCED || from === to) { el.textContent = end; return; }
  const t0 = performance.now();
  el.textContent = fmt(from);
  (function f(t) {
    if (!el.isConnected) return;
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = p >= 1 ? end : fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}
function runCounts() {
  $$('#view [data-count]').forEach(el => {
    const k = el.dataset.count, to = Number(el.dataset.to), dec = Number(el.dataset.dec || 0);
    const from = ui.enter ? 0 : (memo.has(k) ? memo.get(k) : to);
    memo.set(k, to);
    countTo(el, from, to, v => fmtDec(v, dec), 700);
  });
}

function render() {

  $$('.tabs button').forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  runTweens(); runCounts(); tickRest();
  ui.enter = null; ui.fx = {};
}
function commit() { save(); askPersist(); render(); }

function tickRest() {

function switchTheme(change, ev, el) {
  let x = ev && ev.clientX, y = ev && ev.clientY;
  if (!x && !y && el.getBoundingClientRect) { const r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  const run = () => { change(); applyTheme(); save(); render(); };
  const root = document.documentElement;
  if (REDUCED) return run();
  if (!document.startViewTransition) { root.classList.add('theming'); run(); setTimeout(() => root.classList.remove('theming'), 450); return; }
  let ran = false; const once = () => { if (!ran) { ran = true; run(); } };
  try {
    const vt = document.startViewTransition(once);
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    vt.ready.then(() => {
      root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] }, { duration: 560, easing: 'cubic-bezier(.2,0,0,1)', pseudoElement: '::view-transition-new(root)' });
    }).catch(() => {});
  } catch (e) { once(); }
}

/* ================= celebration ================= */
const celeQ = []; let celeOn = false, celeRaf = 0, celeTimer = 0;
function celebrate(c) { celeQ.push(c); if (!celeOn) nextCele(); }
function nextCele() {
  const c = celeQ.shift();
  if (!c) { celeOn = false; return; }
  celeOn = true;
  const el = $('#cele-root');
  const inner = c.kind === 'day' ? ic('check', 'draw') : c.kind === 'week' ? `<b class="num">${c.n}</b>` : ic('up', 'draw');
  el.innerHTML = `<div class="cele" data-act="cele-close"><canvas aria-hidden="true"></canvas><div class="cele-card" role="alertdialog" aria-labelledby="cele-t">
    <div class="emblem">${cookieSVG('cookie')}<span class="in">${inner}</span></div>
    <p class="cele-t" id="cele-t">${esc(c.title)}</p>
    ${c.name ? `<p class="cele-n">${esc(c.name)}</p>` : ''}
    ${c.big != null ? `<p class="cele-v num"><span id="cele-num">${esc(c.big)}</span>${c.unit ? `<small>${c.unit}</small>` : ''}</p>` : ''}
    <p class="cele-s">${esc(c.sub)}</p>
    <button class="btn filled big rip" data-act="cele-close">${c.kind === 'day' ? 'やった' : '続ける'}</button></div></div>`;
  const btn = $('.cele-card button', el); if (btn) btn.focus({ preventScroll: true });
  if (c.count) countTo($('#cele-num'), c.count.from, c.count.to, c.count.fmt, 900, c.big);
  clearTimeout(celeTimer);
  if (c.auto) celeTimer = setTimeout(closeCele, c.auto);
  if (!REDUCED) confetti($('canvas', el));
}
function closeCele() {
  clearTimeout(celeTimer);
  const root = $('#cele-root'), el = $('.cele', root);
  if (!el || el.classList.contains('out')) return;
  el.classList.add('out');
  setTimeout(() => { cancelAnimationFrame(celeRaf); root.innerHTML = ''; nextCele(); }, REDUCED ? 0 : 220);
}
function confetti(cv) {
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--hero-ring', '--primary-c', '--tertiary-c', '--inv-primary', '--s1'].map(v => cs.getPropertyValue(v).trim() || '#fff');
  const ps = [];
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 7 + Math.random() * 12;
    ps.push({ x: W / 2 + (Math.random() - 0.5) * 60, y: H * 0.4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5 + Math.random() * 7, c: cols[i % cols.length], a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.35, k: i % 3 });
  }
  const t0 = performance.now();
  cancelAnimationFrame(celeRaf);
  (function frame(t) {
    const k = (t - t0) / 2800;
    ctx.clearRect(0, 0, W, H);
    if (k >= 1 || !cv.isConnected) return;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    for (const p of ps) {
      p.vy += 0.3; p.vx *= 0.985; p.vy *= 0.995; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(p.a * 1.7)));
      ctx.fillStyle = p.c; ctx.beginPath();
      if (p.k === 0) ctx.arc(0, 0, p.r, 0, 6.2832);                                   // dot
      else if (p.k === 1) { ctx.arc(0, 0, p.r, 0, 6.2832); ctx.arc(0, 0, p.r * 0.4, 0, 6.2832, true); } // ring, like a plate
      else if (ctx.roundRect) ctx.roundRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9, p.r * 0.45); // pill
      else ctx.rect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9);
      ctx.fill('evenodd'); ctx.restore();
    }
    celeRaf = requestAnimationFrame(frame);
  })(t0);
}

const decOf = (a, b) => (Number.isInteger(a) && Number.isInteger(b) ? 0 : Number.isInteger(a * 2) && Number.isInteger(b * 2) ? 1 : 2);

const ACT = {
  tab(el) { if (el.dataset.tab !== ui.tab) go(el.dataset.tab); else window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); },

  },

  'card-open'(el) { const i = Number(el.dataset.i); if (i === ui.active) return; ui.active = i; ui.draft = null; ui.fx = { open: i }; render(); },
  step(el) {
    readDraft(); const d = ui.draft, f = el.dataset.f; if (!d) return;
    let v = (isFinite(d[f]) ? d[f] : 0) + Number(el.dataset.d);
    if (f === 's') {

      else if (v < 0) { if (d.m > 0) { d.m -= 1; v += 60; } else v = 0; }

      if (pr.kind === 'w') { const dec = decOf(pr.prev, pr.val); celebrate(Object.assign(base, { big: fmtN(pr.val), unit: 'kg', count: { from: pr.prev, to: pr.val, fmt: v => v.toFixed(dec) }, sub: `これまでの最高 ${fmtN(pr.prev)}kg から ＋${fmtN(pr.val - pr.prev)}kg` })); }
      else if (pr.kind === 'e') celebrate(Object.assign(base, { big: `${fmtN(set.w)}×${set.r}`, sub: `推定1RMが ${fmtN(Math.round(pr.prev * 10) / 10)}kg から ${fmtN(Math.round(pr.val * 10) / 10)}kg に伸びました` }));
      else if (pr.kind === 'r') celebrate(Object.assign(base, { big: String(pr.val), unit: '回', count: { from: pr.prev, to: pr.val, fmt: v => String(Math.round(v)) }, sub: `これまでの最高 ${pr.prev}回 から ＋${pr.val - pr.prev}回` }));
      else celebrate(Object.assign(base, { big: fmtTime(pr.val), count: { from: pr.prev, to: pr.val, fmt: fmtTime }, sub: `これまでの最長 ${fmtTime(pr.prev)} から ＋${Math.round(pr.val - pr.prev)}秒` }));
    }
    const after = weekCount(dk);
    if (after > before && after === goal) {
      const run = weekRun();
      celebrate({ kind: 'week', n: after, title: '今週の筋トレ目標を達成', sub: run >= 2 ? `週${goal}回を${run}週連続でクリアしました` : `週${goal}回をクリアしました` });
    }
  },
  'del-set'(el) { snap(); const e = session(ui.date)[Number(el.dataset.i)]; if (!e) return; e.sets.splice(Number(el.dataset.j), 1); commit(); toast('セットを消しました', true); },
  'del-entry'(el) {
    snap(); const k = ui.date, list = session(k); list.splice(Number(el.dataset.i), 1);
    if (!list.length) delete state.workouts[k];
    ui.active = Math.max(0, list.length - 1); ui.draft = null; commit(); toast('種目を外しました', true);
  },
  'pick-open'() { openSheet({ type: 'pick', q: '', form: false }); },
  'pick-ex'(el) {
    const k = ui.date, id = el.dataset.id; if (!exById(id)) return;
    if (!state.workouts[k]) state.workouts[k] = [];
    let i = state.workouts[k].findIndex(e => e.ex === id);
    if (i < 0) { state.workouts[k].push({ ex: id, sets: [] }); i = state.workouts[k].length - 1; }
    ui.active = i; ui.draft = null; ui.fx = { open: i }; closeSheet(); commit();
  },
  'newex-toggle'() { const q = $('#pick-q'); if (q) ui.sheet.q = q.value; ui.sheet.form = !ui.sheet.form; renderSheet(true); const n = $('#nx-name'); if (n) n.focus(); },
  'newex-save'() {
    const name = $('#nx-name').value.trim();
    if (!name) return formErr('種目の名前を入れてください。');
    if (state.exercises.some(e => e.name === name)) return formErr('同じ名前の種目がすでにあります。');
    const type = (document.querySelector('input[name="nx-type"]:checked') || {}).value || 'weight';
    const ex = { id: uid(), name: name, cat: $('#nx-cat').value, type: type, barbell: type === 'weight' && $('#nx-bar').checked };
    state.exercises.push(ex);
    ACT['pick-ex']({ dataset: { id: ex.id } });
  },

  heat(el) { ui.heat = el.dataset.id; render(); },
  'heat-day'(el) { ui.heatDay = ui.heatDay === el.dataset.d ? null : el.dataset.d; render(); },
  'chart-metric'(el) { ui.chartMetric = el.dataset.id; ui.chartSel = null; ui.fx = { chart: true }; render(); },
  'chart-pt'(el) { ui.chartSel = Number(el.dataset.i); render(); },

  theme(el, ev) { if (el.dataset.id !== state.settings.palette) switchTheme(() => { state.settings.palette = el.dataset.id; }, ev, el); },
  mode(el, ev) { if (el.dataset.id !== state.settings.mode) switchTheme(() => { state.settings.mode = el.dataset.id; }, ev, el); },
  goal(el) { state.settings.weeklyGoal = Math.min(7, Math.max(1, state.settings.weeklyGoal + Number(el.dataset.d))); commit(); },
  export() { openSheet({ type: 'export', json: JSON.stringify(state) }); },
  'copy-json'() {
    const done = () => { state.settings.lastExport = tkey(); save(); toast('コピーしました'); };
    const fallback = () => { const t = $('#ex-text'); t.focus(); t.select(); try { if (document.execCommand('copy')) return done(); } catch (e) {} toast('コピーできませんでした。文字を長押しして全選択してください'); };
    try { navigator.clipboard.writeText(ui.sheet.json).then(done, fallback); } catch (e) { fallback(); }
  },
  'save-file'() {
    const name = `tsumiage-${tkey()}.json`, json = ui.sheet.json;
    const done = () => { state.settings.lastExport = tkey(); save(); };
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).then(done, () => {}); return; }
    } catch (e) {}
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); done();
    } catch (e) { toast('保存できませんでした。「コピーする」を使ってください'); }
  },
  import() { openSheet({ type: 'import' }); },
  'import-apply'() {
    let next;
    try { next = normalize(JSON.parse($('#im-text').value)); } catch (e) { return formErr('読み込めませんでした。書き出したときの文字が、最初から最後まで入っているか確かめてください。'); }
    next.demo = false; snap(); state = next; applyTheme(); setDate(tkey()); ui.heatDay = null; ui.chartEx = null; ui.chartSel = null;
    closeSheet(); commit(); toast('記録を読み込みました', true);
  },
  wipe() { openSheet({ type: 'confirm', title: 'すべての記録を消す', msg: '筋トレと毎日の目標の記録がすべて消えます。目標の一覧、種目の一覧、テーマは残ります。', yes: '記録を消す', run: 'wipe' }); },
  'confirm-yes'() {
    if (ui.sheet.run === 'wipe') { snap(); state.workouts = {}; state.habitLog = {}; state.demo = false; ui.heatDay = null; ui.chartSel = null; ui.draft = null; closeSheet(); commit(); toast('すべての記録を消しました', true); }
  },
  undo() { if (!undoSnap) return; try { state = normalize(JSON.parse(undoSnap)); } catch (e) { return; } undoSnap = null; ui.draft = null; clearTimeout(toastTimer); $('#toast-root').innerHTML = ''; applyTheme(); commit(); },
  'sheet-close'() { closeSheet(); },
  'cele-close'() { closeCele(); }
};

/* ================= events ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.classList.contains('cele') && ev.target.closest('.cele-card')) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('pointerdown', ev => {
  if (REDUCED) return;
  const el = ev.target.closest && ev.target.closest('.rip'); if (!el || el.disabled) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = document.createElement('span');
  s.className = 'rp'; s.style.cssText = `width:${d}px;height:${d}px;left:${ev.clientX - r.left - d / 2}px;top:${ev.clientY - r.top - d / 2}px`;
  el.appendChild(s); s.addEventListener('animationend', () => s.remove());
}, { passive: true });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#cele-root').firstChild) closeCele(); else if (ui.sheet) closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.hit')) { ev.preventDefault(); ACT['chart-pt'](ev.target); }
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stepper input')) { ev.preventDefault(); ev.target.blur(); }
  if (ev.key === 'Enter' && ev.target.id === 'hb-name') { ev.preventDefault(); ACT['habit-save'](); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.in === 'draft' && ui.draft) { ui.draft[t.dataset.f] = parseNum(t.value); if (t.dataset.f === 'w') refreshPlates(); }
  else if (t.dataset.in === 'pick-q' && ui.sheet) { ui.sheet.q = t.value; const l = $('#pick-list'); if (l) l.innerHTML = pickListHTML(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, c = t.dataset.change;
  if (c === 'chart-ex') { ui.chartEx = t.value; ui.chartSel = null; ui.chartMetric = 'w'; ui.fx = { chart: true }; render(); const s = $('#chart-ex'); if (s) s.focus({ preventScroll: true }); }
  else if (c === 'im-file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const ta = $('#im-text'); if (ta) ta.value = String(fr.result || ''); };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.stepper input')) { try { ev.target.select(); } catch (e) {} } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ui.follow && ui.date !== tkey()) { setDate(tkey()); render(); }
});
setInterval(tickRest, 1000);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state) applyTheme(); }); } catch (e) {}
try { new MutationObserver(() => { if (state) applyTheme(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}

/* ================= boot ================= */
function start(hot) {
  let s = null;
  if (hot && hot.state) s = hot.state;
  if (!s) s = load();
  try { state = s ? normalize(s) : sample(); } catch (e) { state = sample(); }
  applyTheme();
  if (hot && hot.tab && VIEWS[hot.tab]) ui.tab = hot.tab;
  setDate(tkey());
  ui.active = 0;
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ state: state, tab: ui.tab })); } catch (e) {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

if ('serviceWorker' in navigator && !FRAMED && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();

</script>
</body>
