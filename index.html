:root{
  /* Layout: one thumb-reach column, sections split by hairlines, no card grid.
     Weight-plate colours (red 25, blue 20, yellow 15, green 10) carry identity. */
  --paper:#ECEFF2; --surface:#FFFFFF; --ink:#152030; --muted:#566475; --line:#D3D9E0;
  --accent:#1F4FD8; --on-accent:#FFFFFF;
  --plate-red:#D22F3D; --plate-blue:#1F4FD8; --plate-yellow:#D99E00; --plate-green:#17894D;
  --good:#17894D; --danger:#C22534;
  --font-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
  --font-num:"Big Shoulders Display","Hiragino Sans","Noto Sans CJK JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F24; --surface:#262B32; --ink:#EDF0F3; --muted:#A0ABB7; --line:#3B434D;
    --accent:#86A7FF; --on-accent:#10192A;
    --plate-red:#F26B76; --plate-blue:#86A7FF; --plate-yellow:#F0C02E; --plate-green:#4FC78A;
    --good:#4FC78A; --danger:#F26B76;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F24; --surface:#262B32; --ink:#EDF0F3; --muted:#A0ABB7; --line:#3B434D;
  --accent:#86A7FF; --on-accent:#10192A;
  --plate-red:#F26B76; --plate-blue:#86A7FF; --plate-yellow:#F0C02E; --plate-green:#4FC78A;
  --good:#4FC78A; --danger:#F26B76;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.lock{overflow:hidden}
h1,h2,h3,p,ol,ul,figure{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--font-num);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.015em;line-height:1}

#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}

/* ---------- shared pieces ---------- */
.sec{padding:20px 0 22px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:17px;font-weight:700;line-height:1.3;text-wrap:balance}
.sec-h .side{font-size:14px;color:var(--muted);white-space:nowrap}
.sec-h .side .num{font-size:24px;color:var(--ink)}
.note{font-size:13px;line-height:1.6;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:0 10px}
.btn.danger{color:var(--danger)}
.btn.wide{display:flex;width:100%}
.btn.big{min-height:54px;font-size:17px}
.btn:active:not(:disabled){transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.c-red{--c:var(--plate-red)} .c-blue{--c:var(--plate-blue)} .c-yellow{--c:var(--plate-yellow)} .c-green{--c:var(--plate-green)}

/* ---------- today ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 18px}
.top-date{display:flex;align-items:center;gap:2px;min-width:0}
.top h1{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav{width:40px;height:44px;font-size:26px;line-height:1;color:var(--muted);border-radius:8px}
.nav:first-child{margin-left:-12px}
.streak{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.3}
.streak .num{display:block;font-size:46px;color:var(--ink)}

.banner{display:flex;flex-direction:column;gap:10px;padding:14px;margin-bottom:6px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--muted);font-size:14px;line-height:1.6}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:6px 0 4px;border-radius:10px}
.wd-l{font-size:12px;color:var(--muted);line-height:1}
.wd-n{font-size:15px;color:var(--muted)}
.plate{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.done .plate{border:0;background:
  radial-gradient(circle,var(--paper) 0 15%,transparent 16% 52%,color-mix(in oklab,var(--on-accent) 35%,transparent) 53% 58%,transparent 59%),
  var(--accent)}
.cur button{background:var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.cur .wd-l,.cur .wd-n{color:var(--ink)}
.cur.done .plate{background:
  radial-gradient(circle,var(--surface) 0 15%,transparent 16% 52%,color-mix(in oklab,var(--on-accent) 35%,transparent) 53% 58%,transparent 59%),
  var(--accent)}
.future .plate{border-style:dashed}

.habits{display:flex;flex-direction:column;gap:18px}
.habit-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.habit-name{font-weight:700;font-size:16px;line-height:1.3;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.habit-name::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.habit-run{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.habit-val{font-size:14px;color:var(--muted);white-space:nowrap}
.habit-val .num{font-size:26px;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:color-mix(in oklab,var(--ink) 11%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--accent));transition:width .25s ease}
.habit-ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.habit-ctl .btn{min-height:44px}
.habit-ctl .inc{flex:1}
.habit-ctl .dec{flex:none;width:76px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;color:var(--good);border:1.5px solid var(--good);white-space:nowrap}
.pill svg{width:12px;height:12px}

.sum{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sum li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- train ---------- */
.train-h{padding:6px 0 16px}
.train-h h1{font-size:28px;font-weight:800;line-height:1.2}
.train-h p{font-size:14px;color:var(--muted)}
.totals{display:flex;gap:28px;padding:0 0 18px}
.totals div{font-size:13px;color:var(--muted)}
.totals .num{display:block;font-size:34px;color:var(--ink);margin-bottom:2px}
.totals .num small{font-size:18px;margin-left:2px}

.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.card{border-radius:14px;border:1.5px solid var(--line)}
.card.on{background:var(--surface);border-color:var(--ink)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;text-align:left}
.card-h b{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.card-h span{font-size:13px;color:var(--muted);white-space:nowrap}
.card-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.prev{font-size:13px;color:var(--muted);line-height:1.5}
.sets{display:flex;flex-direction:column}
.sets li{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.sets .no{width:20px;font-size:13px;color:var(--muted);text-align:center}
.sets .v{flex:1;font-size:15px;color:var(--muted)}
.sets .v .num{font-size:24px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:var(--plate-red);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.x{width:44px;height:44px;margin-right:-10px;color:var(--muted);display:grid;place-items:center}
.x svg{width:16px;height:16px}

.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry.one{grid-template-columns:1fr}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.stepper button{min-height:52px;font-size:13px;font-weight:700;color:var(--muted)}
.stepper input{min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--font-num);font-weight:800;font-size:30px;padding:0;border-radius:0}
.stepper input:focus{outline:0;background:var(--surface)}
.stepper:focus-within{border-color:var(--accent)}

.plates{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 0}
.pl-row{display:flex;align-items:center;justify-content:center;gap:2px;height:66px;max-width:100%}
.pl-row .bar-mid{flex:0 1 84px;min-width:28px;height:6px;background:#9AA3AD;border-radius:1px}
.pl-row .sleeve{flex:none;width:10px;height:10px;background:#9AA3AD;border-radius:2px}
.pl{flex:none;display:block;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.p25{width:13px;height:64px;background:#D22F3D}
.p20{width:12px;height:64px;background:#2A5BE0}
.p15{width:10px;height:56px;background:#E8B400}
.p10{width:9px;height:48px;background:#1E9A57}
.p5{width:7px;height:36px;background:#F1F3F5}
.p2_5{width:6px;height:28px;background:#59636F}
.p1_25{width:5px;height:22px;background:#59636F}
.plates-cap{font-size:12px;color:var(--muted);text-align:center}
.rest{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.rest .num{font-size:18px;color:var(--ink);margin-left:4px}

/* ---------- progress ---------- */
.lift{display:flex;flex-direction:column;gap:6px}
.lift-n{font-size:72px}
.lift-n small{font-size:30px;margin-left:4px}
.lift-eq{font-size:17px;font-weight:700;line-height:1.4}
.lift-next{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}

.heat{display:grid;gap:3px;align-items:center}
.heat .m{font-size:11px;color:var(--muted);line-height:1;white-space:nowrap;height:14px}
.heat .w{font-size:11px;color:var(--muted);line-height:1}
.cell{display:block;width:100%;aspect-ratio:1;border-radius:3px;background:color-mix(in oklab,var(--ink) 9%,transparent)}
.cell.l1{background:color-mix(in oklab,var(--heat) 30%,var(--paper))}
.cell.l2{background:color-mix(in oklab,var(--heat) 52%,var(--paper))}
.cell.l3{background:color-mix(in oklab,var(--heat) 76%,var(--paper))}
.cell.l4{background:var(--heat)}
.cell.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.cell.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.now.sel{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:8px;font-size:11px;color:var(--muted)}
.legend .cell{width:12px}
.day{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.day h3{font-size:15px}
.day ul{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

.field-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
select,.text,textarea{width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
textarea{padding:10px 12px;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--muted);margin-bottom:4px}
.readout .num{font-size:30px;color:var(--ink)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:color-mix(in oklab,var(--accent) 12%,transparent)}
.chart .pt{fill:var(--paper);stroke:var(--accent);stroke-width:2}
.chart .pt.pr{fill:var(--accent)}
.chart .pt.end{stroke:var(--paper);stroke-width:2;fill:var(--accent)}
.chart .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.chart .endl{fill:var(--ink);font-family:var(--font-num);font-weight:800;font-size:15px}
.chart .hit{fill:transparent;cursor:pointer}
.chart-key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.chart-key i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--accent);margin-right:5px;vertical-align:-1px}
.chart-key i.f{background:var(--accent)}
.chart-sum{font-size:14px;margin-top:10px}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.badge .disc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2px dashed var(--line);color:var(--muted)}
.badge.got .disc{border:0;color:#fff;background:
  radial-gradient(circle,transparent 0 60%,rgba(255,255,255,.3) 61% 66%,transparent 67%),
  var(--plate-blue)}
.badge.over .disc{background:
  radial-gradient(circle,transparent 0 60%,rgba(255,255,255,.3) 61% 66%,transparent 67%),
  var(--plate-red)}
:root[data-theme="dark"] .badge.got .disc{color:#10192A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.got .disc{color:#10192A}}

/* ---------- settings ---------- */
.set-list{display:flex;flex-direction:column}
.set-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;border-top:1px solid var(--line)}
.set-list li:first-child{border-top:0}
.set-list .habit-name small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:14px}
.goal .num{font-size:40px;min-width:1ch;text-align:center}
.goal .btn{width:52px;font-size:22px;padding:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs ul{display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* ---------- sheet / toast / celebration ---------- */
.back{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease}
.sheet > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 8px 6px 16px}
.sheet > header h2{font-size:17px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .text,.sheet select,.sheet textarea{background:var(--paper)}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.form legend{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;padding:0}
.form fieldset{border:0;margin:0;padding:0;min-width:0}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:4px 8px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}
.seg input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg.sw span{min-height:44px}
.seg.sw span::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--c)}
.seg.sw input:checked + span{background:var(--surface);border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.pick-g{font-size:12px;color:var(--muted);padding:10px 0 2px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;border-top:1px solid var(--line);font-size:16px}
.pick button span{font-size:12px;color:var(--muted);white-space:nowrap}

.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:30;max-width:448px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:6px 8px 6px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;line-height:1.4;animation:up .2s ease}
.toast button{min-height:38px;padding:0 12px;border-radius:8px;font-weight:700;color:var(--paper);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.cele{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(10,14,20,.62)}
.cele canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele-card{position:relative;z-index:1;width:100%;max-width:340px;padding:26px 22px 20px;border-radius:18px;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:6px;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.cele-k{align-self:center;display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:4px;background:var(--plate-red);color:#fff;font-size:13px;font-weight:700}
.cele-n{font-size:17px;font-weight:700;margin-top:8px;overflow-wrap:anywhere}
.cele-v{font-size:84px}
.cele-v small{font-size:32px;margin-left:4px}
.cele-s{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.6}

@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  .sheet,.toast,.cele-card{animation:none}
  .bar i{transition:none}
}

</style>

<script>
(function () {
'use strict';

/* ================= helpers ================= */
const KEY = 'tsumiage.v1';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DAY = 864e5;
const r2 = n => Math.round(n * 100) / 100;

function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7));
const tkey = () => dkey(today());

const fmtN = n => String(r2(n));
const fmtInt = n => Math.round(n).toLocaleString('ja-JP');
const fmtDate = (k, wd) => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日` + (wd ? `（${WD[d.getDay()]}）` : ''); };
const fmtShort = k => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtTime = sec => `${Math.floor(sec / 60)}:${pad(Math.round(sec % 60))}`;
function fmtVol(kg) {
  if (kg < 1000) return { v: fmtInt(kg), u: 'kg' };
  const t = kg / 1000;
  return { v: t >= 100 ? fmtInt(t) : (Math.round(t * 10) / 10).toFixed(1), u: 't' };
}
function parseNum(s) {
  s = String(s).replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const FRAMED = window.self !== window.top;
const STANDALONE = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const ICON = {
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.4"/></svg>',
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>'
};

/* ================= data ================= */
const CATS = ['胸', '背中', '脚', '肩', '腕', '体幹', 'その他'];
const TYPES = { weight: '重さ × 回数', reps: '回数のみ', time: '時間' };
const COLORS = ['blue', 'yellow', 'green', 'red'];
const DEFAULT_EX = [
  ['bench', 'ベンチプレス', '胸', 'weight', 1],
  ['dbpress', 'ダンベルプレス', '胸', 'weight', 0],
  ['chestpress', 'チェストプレス', '胸', 'weight', 0],
  ['pushup', '腕立て伏せ', '胸', 'reps', 0],
  ['deadlift', 'デッドリフト', '背中', 'weight', 1],
  ['latpull', 'ラットプルダウン', '背中', 'weight', 0],
  ['row', 'シーテッドロー', '背中', 'weight', 0],
  ['bentrow', 'ベントオーバーロー', '背中', 'weight', 1],
  ['pullup', '懸垂', '背中', 'reps', 0],
  ['squat', 'スクワット', '脚', 'weight', 1],
  ['legpress', 'レッグプレス', '脚', 'weight', 0],
  ['legext', 'レッグエクステンション', '脚', 'weight', 0],
  ['legcurl', 'レッグカール', '脚', 'weight', 0],
  ['ohp', 'オーバーヘッドプレス', '肩', 'weight', 1],
  ['shoulderpress', 'ダンベルショルダープレス', '肩', 'weight', 0],
  ['sideraise', 'サイドレイズ', '肩', 'weight', 0],
  ['curl', 'アームカール', '腕', 'weight', 0],
  ['pressdown', 'トライセプスプレスダウン', '腕', 'weight', 0],
  ['plank', 'プランク', '体幹', 'time', 0],
  ['crunch', 'クランチ', '体幹', 'reps', 0]
];
// Rough reference weights in kg, used only for the "how much is that" comparison.
const REFS = [
  { n: '力士', w: 160, c: '人' },
  { n: 'グランドピアノ', w: 300, c: '台' },
  { n: '軽自動車', w: 900, c: '台' },
  { n: 'アフリカゾウ', w: 6000, c: '頭' },
  { n: '新幹線の車両', w: 44000, c: '両' },
  { n: 'シロナガスクジラ', w: 150000, c: '頭' },
  { n: '奈良の大仏', w: 250000, c: '体' },
  { n: '国際宇宙ステーション', w: 420000, c: '基' },
  { n: '東京タワー', w: 4000000, c: '基' }
];

function fresh() {
  return {
    v: 1, demo: false,
    settings: { weeklyGoal: 3, lastExport: null },
    exercises: DEFAULT_EX.map(e => ({ id: e[0], name: e[1], cat: e[2], type: e[3], barbell: !!e[4] })),
    habits: [
      { id: 'study', name: '勉強', kind: 'num', target: 2, unit: '時間', step: 0.5, color: 'yellow' },
      { id: 'water', name: '水', kind: 'num', target: 2, unit: 'L', step: 0.25, color: 'blue' }
    ],
    workouts: {}, habitLog: {}
  };
}

function sample() {
  const s = fresh(); s.demo = true;
  let seed = 20261113;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t0 = today(), start = addDays(weekStart(t0), -70);
  const plans = {
    1: [['bench', 40, 1.25], ['shoulderpress', 8, 0.4], ['pressdown', 15, 0.75]],
    3: [['deadlift', 60, 2.5], ['latpull', 30, 1.25], ['curl', 6, 0.3]],
    5: [['squat', 50, 2], ['legpress', 80, 4], ['plank', 45, 4]]
  };
  for (let d = start; d < t0; d = addDays(d, 1)) {
    const k = dkey(d), ago = Math.round((t0 - d) / DAY), wk = Math.floor(Math.round((d - start) / DAY) / 7);
    const plan = plans[d.getDay()];
    if (plan && (ago <= 7 || rnd() > 0.18)) {
      s.workouts[k] = plan.map(p => {
        const id = p[0], base = p[1], rate = p[2];
        if (id === 'plank') { const t = Math.round((base + wk * rate) / 5) * 5; return { ex: id, sets: [{ t: t }, { t: t - 5 }] }; }
        const st = base < 12 ? 1 : 2.5;
        const w = Math.round((base + wk * rate) / st) * st, r = 8 + Math.floor(rnd() * 3);
        return { ex: id, sets: [{ w: w, r: r }, { w: w, r: r - (rnd() > 0.5 ? 1 : 0) }, { w: w, r: r - 1 - Math.floor(rnd() * 2) }] };
      });
    }
    const recent = ago <= 5;
    s.habitLog[k] = {
      study: recent ? [2, 2.5, 2, 3, 2][ago - 1] : [0, 1, 1.5, 2, 2, 2.5, 3, 2][Math.floor(rnd() * 8)],
      water: recent ? 2 : [1, 1.5, 2, 2, 2, 2.25, 1.75, 2][Math.floor(rnd() * 8)]
    };
  }
  s.habitLog[dkey(t0)] = { study: 0.5, water: 0.75 };
  return s;
}

function normalize(o) {
  if (!o || typeof o !== 'object' || !o.workouts || typeof o.workouts !== 'object' || !Array.isArray(o.habits) || !Array.isArray(o.exercises)) {
    throw new Error('bad');
  }
  const f = fresh();
  const s = {
    v: 1, demo: !!o.demo,
    settings: { weeklyGoal: Math.min(7, Math.max(1, Math.round(Number(o.settings && o.settings.weeklyGoal) || 3))), lastExport: (o.settings && o.settings.lastExport) || null },
    exercises: o.exercises.filter(e => e && e.id && e.name).map(e => ({ id: String(e.id), name: String(e.name), cat: CATS.includes(e.cat) ? e.cat : 'その他', type: TYPES[e.type] ? e.type : 'weight', barbell: !!e.barbell })),
    habits: o.habits.filter(h => h && h.id && h.name).map(h => ({ id: String(h.id), name: String(h.name), kind: h.kind === 'check' ? 'check' : 'num', target: Number(h.target) > 0 ? Number(h.target) : 1, unit: String(h.unit || ''), step: Number(h.step) > 0 ? Number(h.step) : 1, color: COLORS.includes(h.color) ? h.color : 'blue' })),
    workouts: {}, habitLog: {}
  };
  if (!s.exercises.length) s.exercises = f.exercises;
  const okKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  for (const k of Object.keys(o.workouts)) {
    if (!okKey(k) || !Array.isArray(o.workouts[k])) continue;
    const list = o.workouts[k].filter(e => e && e.ex && Array.isArray(e.sets)).map(e => ({
      ex: String(e.ex),
      sets: e.sets.filter(x => x && typeof x === 'object').map(x => {
        const y = {};
        if (isFinite(x.w)) y.w = Number(x.w);
        if (isFinite(x.r)) y.r = Number(x.r);
        if (isFinite(x.t)) y.t = Number(x.t);
        return y;
      })
    }));
    if (list.length) s.workouts[k] = list;
  }
  const hl = o.habitLog && typeof o.habitLog === 'object' ? o.habitLog : {};
  for (const k of Object.keys(hl)) {
    if (!okKey(k) || !hl[k] || typeof hl[k] !== 'object') continue;
    const day = {};
    for (const id of Object.keys(hl[k])) if (isFinite(hl[k][id]) && Number(hl[k][id]) > 0) day[id] = Number(hl[k][id]);
    if (Object.keys(day).length) s.habitLog[k] = day;
  }
  return s;
}

let state, storageOk = true, undoSnap = null;
function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) { storageOk = false; } return null; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
}
let askedPersist = false;
function askPersist() {
  if (askedPersist || FRAMED) return; askedPersist = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
const snap = () => { undoSnap = JSON.stringify(state); };

/* ================= derived ================= */
const exById = id => state.exercises.find(e => e.id === id);
const session = k => state.workouts[k] || [];
const hasWorkout = k => session(k).some(e => e.sets.length > 0);
const setCount = k => session(k).reduce((a, e) => a + e.sets.length, 0);
const setVol = x => (x.w > 0 && x.r > 0 ? x.w * x.r : 0);
const dayVol = k => session(k).reduce((a, e) => a + e.sets.reduce((b, x) => b + setVol(x), 0), 0);
const habitVal = (k, h) => (state.habitLog[k] && state.habitLog[k][h.id]) || 0;
const habitGoal = h => (h.kind === 'check' ? 1 : h.target);
const habitDone = (k, h) => habitVal(k, h) >= habitGoal(h) - 1e-9;
const dayActive = k => hasWorkout(k) || state.habits.some(h => habitDone(k, h));
function streakOf(fn) {
  let d = today(), n = 0;
  if (!fn(dkey(d))) d = addDays(d, -1);
  while (fn(dkey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function weekCount(k) {
  const ws = weekStart(parseKey(k)); let n = 0;
  for (let i = 0; i < 7; i++) if (hasWorkout(dkey(addDays(ws, i)))) n++;
  return n;
}
function totalVol() { let t = 0; for (const k of Object.keys(state.workouts)) t += dayVol(k); return t; }
function exHistory(id) {
  const out = [];
  for (const d of Object.keys(state.workouts).sort()) {
    const sets = [];
    for (const e of state.workouts[d]) if (e.ex === id) for (const x of e.sets) sets.push(x);
    if (sets.length) out.push({ d: d, sets: sets });
  }
  return out;
}
const prevSession = (id, k) => { const h = exHistory(id).filter(x => x.d < k); return h.length ? h[h.length - 1] : null; };
const e1rm = x => (x.r <= 1 ? x.w : x.w * (1 + x.r / 30));
const setText = (ex, x) => ex.type === 'weight' ? `${fmtN(x.w)}×${x.r}` : ex.type === 'reps' ? `${x.r}回` : fmtTime(x.t);

// A set is a personal best when it beats everything logged before it,
// but only once the exercise has an earlier session to compare against.
function scanPRs(id) {
  const ex = exById(id), out = new Map();
  if (!ex) return out;
  let mw = 0, me = 0, mr = 0, mt = 0;
  exHistory(id).forEach((h, si) => {
    h.sets.forEach((x, i) => {
      const key = h.d + '|' + i;
      if (ex.type === 'weight') {
        const e = e1rm(x);
        if (si > 0 && x.w > mw + 1e-9) out.set(key, { kind: 'w', prev: mw, val: x.w });
        else if (si > 0 && x.r <= 15 && e > me + 0.05) out.set(key, { kind: 'e', prev: me, val: e });
        mw = Math.max(mw, x.w || 0); me = Math.max(me, x.r <= 15 ? e : 0);
      } else if (ex.type === 'reps') {
        if (si > 0 && x.r > mr) out.set(key, { kind: 'r', prev: mr, val: x.r });
        mr = Math.max(mr, x.r || 0);
      } else {
        if (si > 0 && x.t > mt) out.set(key, { kind: 't', prev: mt, val: x.t });
        mt = Math.max(mt, x.t || 0);
      }
    });
  });
  return out;
}

function ensureDraft() {
  const dk = ui.date, ses = session(dk);
  if (ui.active >= ses.length) ui.active = Math.max(0, ses.length - 1);
  const e = ses[ui.active];
  if (!e) { ui.draft = null; return; }
  const key = dk + '|' + ui.active + '|' + e.ex;
  if (ui.draft && ui.draft.key === key) return;
  const ex = exById(e.ex) || {}, last = e.sets[e.sets.length - 1], prev = prevSession(e.ex, dk);
  const ref = last || (prev && prev.sets[0]) || {};
  ui.draft = {
    key: key,
    w: ref.w != null ? ref.w : (ex.barbell ? 20 : 10),
    r: ref.r != null ? ref.r : 10,
    m: ref.t != null ? Math.floor(ref.t / 60) : 0,
    s: ref.t != null ? ref.t % 60 : 30
  };
}

function platesHTML(w) {
  const BAR = 20;
  if (!(w >= BAR)) return `<p class="plates-cap">バー（20kg）より軽い重さです</p>`;
  let side = (w - BAR) / 2; const used = [];
  for (const p of [25, 20, 15, 10, 5, 2.5, 1.25]) while (side >= p - 1e-9 && used.length < 12) { used.push(p); side -= p; }
  const pl = p => `<i class="pl p${String(p).replace('.', '_')}"></i>`;
  const cap = used.length ? `片側 ${used.map(fmtN).join('・')}` : 'プレートなし';
  return `<div class="pl-row" role="img" aria-label="バー20kgと${cap}">${used.slice().reverse().map(pl).join('')}<i class="sleeve"></i><i class="bar-mid"></i><i class="sleeve"></i>${used.map(pl).join('')}</div>
    <p class="plates-cap">バー20kg ＋ ${cap}${side > 1e-6 ? `（残り${fmtN(side * 2)}kgは組めません）` : ''}</p>`;
}

function stepper(f, label, val, d) {

    <button data-act="step" data-f="${f}" data-d="${-d}" aria-label="${label}を${d}減らす">−${d}</button>
    <input id="in-${f}" data-in="draft" data-f="${f}" type="text" inputmode="decimal" autocomplete="off" value="${fmtN(val)}">
    <button data-act="step" data-f="${f}" data-d="${d}" aria-label="${label}を${d}増やす">＋${d}</button></div></div>`;
}

function liftHTML() {

function heatHTML() {
  const N = 16, t = today(), tk = dkey(t), start = addDays(weekStart(t), -(N - 1) * 7);
  const habit = state.habits.find(h => h.id === ui.heat);
  if (ui.heat !== 'workout' && !habit) ui.heat = 'workout';
  const chips = `<button class="chip" data-act="heat" data-id="workout" aria-pressed="${ui.heat === 'workout'}">筋トレ</button>` +
    state.habits.map(h => `<button class="chip" data-act="heat" data-id="${esc(h.id)}" aria-pressed="${ui.heat === h.id}">${esc(h.name)}</button>`).join('');
  let cells = '', lastM = -1;
  for (let c = 0; c < N; c++) {
    const mon = addDays(start, c * 7);
    if (mon.getMonth() !== lastM && !(c === 0 && addDays(mon, 7).getMonth() !== mon.getMonth())) { cells += `<span class="m" style="grid-column:${c + 2};grid-row:1">${mon.getMonth() + 1}月</span>`; lastM = mon.getMonth(); }
    for (let r = 0; r < 7; r++) {
      const d = addDays(mon, r), k = dkey(d);
      if (k > tk) continue;
      let lv = 0, lab;
      if (habit) {
        const v = habitVal(k, habit), g = habitGoal(habit), q = v / g;
        lv = q >= 1 ? 4 : q >= 0.75 ? 3 : q >= 0.5 ? 2 : q > 0 ? 1 : 0;
        lab = habit.kind === 'num' ? `${fmtN(v)}${habit.unit}` : (v ? '達成' : '未達成');
      } else {
        const n = setCount(k);
        lv = n >= 12 ? 4 : n >= 8 ? 3 : n >= 4 ? 2 : n > 0 ? 1 : 0;
        lab = n ? `${n}セット` : '記録なし';
      }
      cells += `<button class="cell l${lv}${k === ui.heatDay ? ' sel' : ''}${k === tk ? ' now' : ''}" style="grid-column:${c + 2};grid-row:${r + 2}" data-act="heat-day" data-d="${k}" aria-label="${fmtDate(k, 1)} ${esc(lab)}"${k === ui.heatDay ? ' aria-pressed="true"' : ''}></button>`;
    }
  }
  const wl = [0, 2, 4].map(r => `<span class="w" style="grid-column:1;grid-row:${r + 2}">${WD[(r + 1) % 7]}</span>`).join('');
  let day = '';
  if (ui.heatDay) {
    const k = ui.heatDay, n = setCount(k), vol = dayVol(k);
    const items = [`筋トレ：${n ? `${n}セット${vol ? `・${fmtInt(vol)}kg` : ''}` : '記録なし'}`].concat(state.habits.map(h => {
      const v = habitVal(k, h);
      return `${esc(h.name)}：${h.kind === 'num' ? `${fmtN(v)} / ${fmtN(h.target)} ${esc(h.unit)}` : (v ? '達成' : '未達成')}${h.kind === 'num' && habitDone(k, h) ? '（達成）' : ''}`;
    }));
    day = `<div class="day"><h3>${fmtDate(k, 1)}</h3><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul><button class="btn" data-act="open-day" data-d="${k}">この日を開いて直す</button></div>`;
  }
  const heatVar = habit ? `var(--plate-${habit.color})` : 'var(--accent)';
  return `<div class="chips">${chips}</div>
    <div class="heat" style="--heat:${heatVar};grid-template-columns:16px repeat(${N},minmax(0,1fr))">${wl}${cells}</div>
    <div class="legend" style="--heat:${heatVar}"><span>${habit ? '0' : '少ない'}</span><i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i><span>${habit ? '達成' : '多い'}</span></div>
    ${day || `<p class="note" style="margin-top:8px">マスを押すと、その日の記録を見られます。</p>`}`;
}

function niceTicks(lo, hi, n) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), q = raw / mag;
  const step = (q <= 1 ? 1 : q <= 2 ? 2 : q <= 2.5 ? 2.5 : q <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(r2(v));
  return out;
}

function chartHTML() {
  const used = state.exercises.map(e => ({ e: e, h: exHistory(e.id) })).filter(x => x.h.length).sort((a, b) => b.h.length - a.h.length);
  if (!used.length) return `<p class="empty">筋トレを記録すると、種目ごとの伸びがここにグラフで出ます。</p>`;
  let cur = used.find(x => x.e.id === ui.chartEx) || used[0];
  ui.chartEx = cur.e.id;
  const ex = cur.e, hist = cur.h.slice(-40);
  const metrics = ex.type === 'weight' ? [['w', '最高重量'], ['e', '推定1RM']] : ex.type === 'reps' ? [['r', '最高回数']] : [['t', '最長時間']];
  if (!metrics.some(m => m[0] === ui.chartMetric)) ui.chartMetric = metrics[0][0];
  const mt = ui.chartMetric;
  const val = x => mt === 'w' ? (x.w || 0) : mt === 'e' ? e1rm(x) : mt === 'r' ? (x.r || 0) : (x.t || 0);
  const show = v => mt === 't' ? fmtTime(v) : mt === 'r' ? `${fmtN(v)}回` : `${fmtN(Math.round(v * 10) / 10)}kg`;
  const tick = v => mt === 't' ? fmtTime(v) : fmtN(v);
  const pts = hist.map(h => ({ d: h.d, v: Math.max.apply(null, h.sets.map(val)) }));
  let run = -Infinity; pts.forEach((p, i) => { p.pr = i > 0 && p.v > run + 1e-9; run = Math.max(run, p.v); });
  const sel = ui.chartSel != null && pts[ui.chartSel] ? ui.chartSel : pts.length - 1;

  const W = 340, H = 190, L = 36, R = 46, T = 14, B = 26;
  const ticks = niceTicks(Math.min.apply(null, pts.map(p => p.v)), Math.max.apply(null, pts.map(p => p.v)), 3);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length - 1].d).getTime();
  const X = p => pts.length === 1 || t1 === t0 ? L + (W - L - R) / 2 : L + 10 + (parseKey(p.d).getTime() - t0) / (t1 - t0) * (W - L - R - 10);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const f1 = n => n.toFixed(1);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + f1(X(p)) + ' ' + f1(Y(p.v))).join('');
  const lastI = pts.length - 1, lp = pts[lastI];
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.name)}の${metrics.find(m => m[0] === mt)[1]}の推移。最初 ${show(pts[0].v)}、最新 ${show(lp.v)}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text class="ax" x="${L - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">${tick(v)}</text>`).join('')}
    <text class="ax" x="${L + 10}" y="${H - 6}" text-anchor="middle">${fmtShort(pts[0].d)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(lp.d)}</text>` : ''}
    ${pts.length > 1 ? `<path class="area" d="${line}L${f1(X(lp))} ${H - B}L${f1(X(pts[0]))} ${H - B}Z"/><path class="ln" d="${line}"/>` : ''}
    ${sel !== lastI ? `<line class="guide" x1="${f1(X(pts[sel]))}" x2="${f1(X(pts[sel]))}" y1="${T}" y2="${H - B}"/>` : ''}
    ${pts.map((p, i) => i === lastI ? '' : `<circle class="pt${p.pr ? ' pr' : ''}" cx="${f1(X(p))}" cy="${f1(Y(p.v))}" r="${i === sel ? 5.5 : 4}"/>`).join('')}
    <circle class="pt end" cx="${f1(X(lp))}" cy="${f1(Y(lp.v))}" r="6"/>
    <text class="endl" x="${f1(X(lp) + 10)}" y="${f1(Y(lp.v) + 5)}">${mt === 't' ? fmtTime(lp.v) : fmtN(Math.round(lp.v * 10) / 10)}</text>
    ${pts.map((p, i) => `<circle class="hit" cx="${f1(X(p))}" cy="${f1(Y(p.v))}" r="13" data-act="chart-pt" data-i="${i}" tabindex="0" role="button" aria-label="${fmtDate(p.d)} ${show(p.v)}"/>`).join('')}
  </svg>`;
  const diff = lp.v - pts[0].v;
  const dshow = mt === 't' ? `${Math.round(Math.abs(diff))}秒` : mt === 'r' ? `${fmtN(Math.abs(diff))}回` : `${fmtN(Math.round(Math.abs(diff) * 10) / 10)}kg`;
  return `
    <div class="field-row"><label for="chart-ex" class="note" style="flex:none">種目</label><select id="chart-ex" data-change="chart-ex">${used.map(x => `<option value="${esc(x.e.id)}"${x.e.id === ex.id ? ' selected' : ''}>${esc(x.e.name)}</option>`).join('')}</select></div>
    ${metrics.length > 1 ? `<div class="chips">${metrics.map(m => `<button class="chip" data-act="chart-metric" data-id="${m[0]}" aria-pressed="${m[0] === mt}">${m[1]}</button>`).join('')}</div>` : ''}
    <p class="readout"><span>${fmtDate(pts[sel].d, 1)}${pts[sel].pr ? ' <span class="tag">自己ベスト</span>' : ''}</span><b class="num">${show(pts[sel].v)}</b></p>
    <figure class="chart">${svg}</figure>
    <p class="chart-key"><span><i class="f"></i>自己ベストを更新した日</span><span><i></i>それ以外の日</span></p>
    ${pts.length > 1 ? `<p class="chart-sum">最初の ${show(pts[0].v)} から ${diff > 0 ? `<b>${dshow}伸びました</b>` : diff < 0 ? `${dshow}下がっています` : '変わっていません'}（${pts.length}回の記録）</p>` : `<p class="chart-sum">次に記録すると、線でつながります。</p>`}
    ${mt === 'e' ? `<p class="note" style="margin-top:6px">推定1RMは、重さと回数から計算した「1回だけ挙げられる重さ」の目安です。</p>` : ''}`;
}

function badgesHTML() {
  const goal = state.settings.weeklyGoal, ws = weekStart(today());
  let html = '', got = 0, run = 0, runOpen = true;
  for (let i = 0; i < 8; i++) {
    const s = addDays(ws, -7 * i), n = weekCount(dkey(s)), ok = n >= goal;
    if (ok) got++;
    if (runOpen) { if (ok) run++; else if (i > 0) runOpen = false; }
    html = `<li class="badge${ok ? ' got' : ''}${n > goal ? ' over' : ''}"><span class="disc num" aria-hidden="true">${n}</span><span>${i === 0 ? '今週' : fmtShort(dkey(s)) + '〜'}<br>${ok ? '達成' : `${n}/${goal}回`}</span></li>` + html;
  }
  return `<ol class="badges">${html}</ol><p class="note" style="margin-top:12px">直近8週のうち${got}週で達成${run >= 2 ? `、${run}週連続で達成中` : ''}。数字はその週に筋トレをした日数です。</p>`;
}

function celebrate(name, big, unit, sub) {

  if (REDUCED) return;
  const cv = $('canvas', el), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = ['#D22F3D', '#2A5BE0', '#E8B400', '#1E9A57', '#F1F3F5'];
  const ps = []; for (let i = 0; i < 70; i++) ps.push({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.42, vx: (Math.random() - 0.5) * 13, vy: -6 - Math.random() * 11, r: 6 + Math.random() * 9, c: cols[i % cols.length], a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3 });
  const t0 = performance.now();
  cancelAnimationFrame(celeRaf);
  (function frame(t) {
    const k = (t - t0) / 2600;
    ctx.clearRect(0, 0, W, H);
    if (k >= 1 || !cv.isConnected) return;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    for (const p of ps) {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      // each piece is a tiny weight plate seen at an angle
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(p.a * 1.7)));
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.2832); ctx.arc(0, 0, p.r * 0.28, 0, 6.2832, true); ctx.fillStyle = p.c; ctx.fill('evenodd'); ctx.restore();
    }
    celeRaf = requestAnimationFrame(frame);
  })(t0);
}

/* ================= actions ================= */
function readDraft() {
  const d = ui.draft; if (!d) return;
  ['w', 'r', 'm', 's'].forEach(f => { const el = $('#in-' + f); if (el) d[f] = parseNum(el.value); });
}
function refreshPlates() { const el = $('#plates'); if (el && ui.draft) el.innerHTML = platesHTML(ui.draft.w); }

const ACT = {
  tab(el) { go(el.dataset.tab); },
  'go-day'(el) { setDate(el.dataset.d); render(); },
  'day-shift'(el) { setDate(dkey(addDays(parseKey(ui.date), Number(el.dataset.d)))); render(); },
  'open-day'(el) { setDate(el.dataset.d); go('today'); },
  'go-train'() { go('train'); },
  'demo-clear'() { snap(); const keep = state.settings.weeklyGoal; state = fresh(); state.settings.weeklyGoal = keep; setDate(tkey()); ui.heatDay = null; ui.chartEx = null; ui.chartSel = null; commit(); toast('サンプルを消しました', true); },

  'habit-add'(el) {
    const h = state.habits.find(x => x.id === el.dataset.id); if (!h) return;
    const k = ui.date, was = habitDone(k, h), v = Math.max(0, r2(habitVal(k, h) + Number(el.dataset.d) * h.step));
    setHabit(k, h, v); commit(); afterHabit(h, was);
  },
  'habit-toggle'(el) {
    const h = state.habits.find(x => x.id === el.dataset.id); if (!h) return;
    const k = ui.date, was = habitDone(k, h);
    setHabit(k, h, was ? 0 : 1); commit(); afterHabit(h, was);
  },
  'habit-edit'(el) { openSheet({ type: 'habit', id: el.dataset.id || null }); const n = $('#hb-name'); if (n && !el.dataset.id) n.focus(); },
  'habit-save'() {
    const sh = ui.sheet, name = $('#hb-name').value.trim(), kind = $('#hb-kind-check').checked ? 'check' : 'num';
    const target = parseNum($('#hb-target').value), step = parseNum($('#hb-step').value), unit = $('#hb-unit').value.trim();
    const color = (document.querySelector('input[name="hb-color"]:checked') || {}).value || 'blue';
    if (!name) return formErr('名前を入れてください。');
    if (kind === 'num' && !(target > 0)) return formErr('1日の目標は0より大きい数字で入れてください。');
    if (kind === 'num' && !(step > 0)) return formErr('ボタン1回で増やす量は0より大きい数字で入れてください。');
    const data = { name: name, kind: kind, target: kind === 'num' ? target : 1, unit: kind === 'num' ? unit : '', step: kind === 'num' ? step : 1, color: color };
    const h = state.habits.find(x => x.id === sh.id);
    if (h) Object.assign(h, data); else state.habits.push(Object.assign({ id: uid() }, data));
    closeSheet(); commit(); toast(h ? '変更を保存しました' : '目標を追加しました');
  },
  'habit-del'() {
    const id = ui.sheet.id; snap();
    state.habits = state.habits.filter(h => h.id !== id);
    for (const k of Object.keys(state.habitLog)) { delete state.habitLog[k][id]; if (!Object.keys(state.habitLog[k]).length) delete state.habitLog[k]; }
    closeSheet(); commit(); toast('目標を消しました', true);
  },

  'card-open'(el) { ui.active = Number(el.dataset.i); ui.draft = null; render(); },
  step(el) {
    readDraft(); const d = ui.draft, f = el.dataset.f; if (!d) return;
    let v = (isFinite(d[f]) ? d[f] : 0) + Number(el.dataset.d);
    if (f === 's') {
      if (v >= 60) { d.m = (isFinite(d.m) ? d.m : 0) + 1; v -= 60; }
      else if (v < 0) { if (d.m > 0) { d.m -= 1; v += 60; } else v = 0; }
      const m = $('#in-m'); if (m) m.value = fmtN(d.m);
    }
    d[f] = Math.max(f === 'r' ? 1 : 0, r2(v));
    const inp = $('#in-' + f); if (inp) inp.value = fmtN(d[f]);
    refreshPlates();
  },
  'log-set'() {
    const dk = ui.date, e = session(dk)[ui.active]; if (!e) return;
    const ex = exById(e.ex); readDraft(); const d = ui.draft; let set;
    if (ex.type === 'weight') {
      if (!(d.w >= 0) || !(d.r >= 1)) return toast('重さと回数を数字で入れてください');
      set = { w: r2(d.w), r: Math.round(d.r) };
    } else if (ex.type === 'reps') {
      if (!(d.r >= 1)) return toast('回数を数字で入れてください');
      set = { r: Math.round(d.r) };
    } else {
      const t = Math.round((d.m > 0 ? d.m : 0) * 60 + (d.s > 0 ? d.s : 0));
      if (!(t > 0)) return toast('時間を入れてください');
      set = { t: t };
    }
    const before = weekCount(dk);
    e.sets.push(set); lastSetAt = Date.now();
    const pr = scanPRs(ex.id).get(dk + '|' + (exHistory(ex.id).find(h => h.d === dk).sets.length - 1));
    commit();
    if (pr) {
      if (pr.kind === 'w') celebrate(ex.name, fmtN(pr.val), 'kg', `これまでの最高 ${fmtN(pr.prev)}kg から ＋${fmtN(pr.val - pr.prev)}kg`);
      else if (pr.kind === 'e') celebrate(ex.name, `${fmtN(set.w)}×${set.r}`, '', `推定1RMが ${fmtN(Math.round(pr.prev * 10) / 10)}kg → ${fmtN(Math.round(pr.val * 10) / 10)}kg に伸びました`);
      else if (pr.kind === 'r') celebrate(ex.name, String(pr.val), '回', `これまでの最高 ${pr.prev}回 から ＋${pr.val - pr.prev}回`);
      else celebrate(ex.name, fmtTime(pr.val), '', `これまでの最長 ${fmtTime(pr.prev)} から ＋${Math.round(pr.val - pr.prev)}秒`);
    } else {
      const after = weekCount(dk);
      if (after > before && after === state.settings.weeklyGoal) toast('今週の筋トレ目標を達成しました');
    }
  },
  'del-set'(el) { snap(); const e = session(ui.date)[Number(el.dataset.i)]; if (!e) return; e.sets.splice(Number(el.dataset.j), 1); commit(); toast('セットを消しました', true); },
  'del-entry'(el) {
    snap(); const k = ui.date, list = session(k); list.splice(Number(el.dataset.i), 1);
    if (!list.length) delete state.workouts[k];
    ui.active = Math.max(0, list.length - 1); ui.draft = null; commit(); toast('種目を外しました', true);
  },
  'pick-open'() { openSheet({ type: 'pick', q: '', form: false }); },
  'pick-ex'(el) {
    const k = ui.date, id = el.dataset.id; if (!exById(id)) return;
    if (!state.workouts[k]) state.workouts[k] = [];
    let i = state.workouts[k].findIndex(e => e.ex === id);
    if (i < 0) { state.workouts[k].push({ ex: id, sets: [] }); i = state.workouts[k].length - 1; }
    ui.active = i; ui.draft = null; closeSheet(); commit();
  },
  'newex-toggle'() { const q = $('#pick-q'); if (q) ui.sheet.q = q.value; ui.sheet.form = !ui.sheet.form; renderSheet(); const n = $('#nx-name'); if (n) n.focus(); },
  'newex-save'() {
    const name = $('#nx-name').value.trim();
    if (!name) return formErr('種目の名前を入れてください。');
    if (state.exercises.some(e => e.name === name)) return formErr('同じ名前の種目がすでにあります。');
    const type = (document.querySelector('input[name="nx-type"]:checked') || {}).value || 'weight';
    const ex = { id: uid(), name: name, cat: $('#nx-cat').value, type: type, barbell: type === 'weight' && $('#nx-bar').checked };
    state.exercises.push(ex);
    ACT['pick-ex']({ dataset: { id: ex.id } });
  },

  heat(el) { ui.heat = el.dataset.id; render(); },
  'heat-day'(el) { ui.heatDay = ui.heatDay === el.dataset.d ? null : el.dataset.d; render(); },
  'chart-metric'(el) { ui.chartMetric = el.dataset.id; ui.chartSel = null; render(); },
  'chart-pt'(el) { ui.chartSel = Number(el.dataset.i); render(); },

  goal(el) { state.settings.weeklyGoal = Math.min(7, Math.max(1, state.settings.weeklyGoal + Number(el.dataset.d))); commit(); },
  export() { openSheet({ type: 'export', json: JSON.stringify(state) }); },
  'copy-json'() {
    const done = () => { state.settings.lastExport = tkey(); save(); toast('コピーしました'); };
    const fallback = () => { const t = $('#ex-text'); t.focus(); t.select(); try { if (document.execCommand('copy')) return done(); } catch (e) {} toast('コピーできませんでした。文字を長押しして全選択してください'); };
    try { navigator.clipboard.writeText(ui.sheet.json).then(done, fallback); } catch (e) { fallback(); }
  },
  'save-file'() {
    const name = `tsumiage-${tkey()}.json`, json = ui.sheet.json;
    const done = () => { state.settings.lastExport = tkey(); save(); };
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).then(done, () => {}); return; }
    } catch (e) {}
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); done();
    } catch (e) { toast('保存できませんでした。「コピーする」を使ってください'); }
  },
  import() { openSheet({ type: 'import' }); },
  'import-apply'() {
    let next;
    try { next = normalize(JSON.parse($('#im-text').value)); } catch (e) { return formErr('読み込めませんでした。書き出したときの文字が、最初から最後まで入っているか確かめてください。'); }
    next.demo = false; snap(); state = next; setDate(tkey()); ui.heatDay = null; ui.chartEx = null; ui.chartSel = null;
    closeSheet(); commit(); toast('記録を読み込みました', true);
  },
  wipe() { openSheet({ type: 'confirm', title: 'すべての記録を消す', msg: '筋トレと毎日の目標の記録がすべて消えます。目標の設定と種目の一覧は残ります。', yes: '記録を消す', run: 'wipe' }); },
  'confirm-yes'() {
    if (ui.sheet.run === 'wipe') { snap(); state.workouts = {}; state.habitLog = {}; state.demo = false; ui.heatDay = null; ui.chartSel = null; ui.draft = null; closeSheet(); commit(); toast('すべての記録を消しました', true); }
  },
  undo() { if (!undoSnap) return; try { state = normalize(JSON.parse(undoSnap)); } catch (e) { return; } undoSnap = null; ui.draft = null; $('#toast-root').innerHTML = ''; commit(); },
  'sheet-close'() { closeSheet(); },
  'cele-close'() { cancelAnimationFrame(celeRaf); $('#cele-root').innerHTML = ''; }
};

function setHabit(k, h, v) {
  if (v > 0) { if (!state.habitLog[k]) state.habitLog[k] = {}; state.habitLog[k][h.id] = v; }
  else if (state.habitLog[k]) { delete state.habitLog[k][h.id]; if (!Object.keys(state.habitLog[k]).length) delete state.habitLog[k]; }
}
function afterHabit(h, was) {
  const k = ui.date;
  if (was || !habitDone(k, h)) return;
  toast(state.habits.length > 1 && state.habits.every(x => habitDone(k, x)) ? '毎日の目標をすべて達成しました' : `${h.name}の目標を達成しました`);
}

/* ================= events ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.dataset.act === 'cele-close' && el.classList.contains('cele') && ev.target.closest('.cele-card')) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#cele-root').firstChild) ACT['cele-close'](); else if (ui.sheet) closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.hit')) { ev.preventDefault(); ACT['chart-pt'](ev.target); }
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stepper input')) { ev.preventDefault(); ev.target.blur(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.in === 'draft' && ui.draft) { ui.draft[t.dataset.f] = parseNum(t.value); if (t.dataset.f === 'w') refreshPlates(); }
  else if (t.dataset.in === 'pick-q' && ui.sheet) { ui.sheet.q = t.value; const l = $('#pick-list'); if (l) l.innerHTML = pickListHTML(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, c = t.dataset.change;
  if (c === 'chart-ex') { ui.chartEx = t.value; ui.chartSel = null; ui.chartMetric = 'w'; render(); const s = $('#chart-ex'); if (s) s.focus({ preventScroll: true }); }
  else if (c === 'habit-kind') { ui.sheet.kind = t.value; $('#hb-num').hidden = t.value !== 'num'; }
  else if (c === 'im-file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const ta = $('#im-text'); if (ta) ta.value = String(fr.result || ''); };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.stepper input')) { try { ev.target.select(); } catch (e) {} } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ui.follow && ui.date !== tkey()) { setDate(tkey()); render(); }
});
setInterval(tickRest, 1000);

/* ================= boot ================= */
function start(hot) {
  let s = null;
  if (hot && hot.state) s = hot.state;
  if (!s) s = load();
  try { state = s ? normalize(s) : sample(); } catch (e) { state = sample(); }
  if (hot && hot.tab && VIEWS[hot.tab]) ui.tab = hot.tab;
  setDate(tkey());
  ui.active = 0;
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ state: state, tab: ui.tab })); } catch (e) {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

if ('serviceWorker' in navigator && !FRAMED && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();

</script>
</body>
